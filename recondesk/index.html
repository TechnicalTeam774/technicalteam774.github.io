let PENDING_DATE=null;
function openEntry(date){ PENDING_DATE=date; S.view='entry'; render(); window.scrollTo(0,0); }

function varianceReadout(day){
  if(!day || day.diff===null)
    return {cls:'zero', val:'—', exp:t('var_exp_nodata'), st:null};
  const up=day.diff>0, abs=Math.abs(day.diff);
  if(Math.abs(day.diff)<=S.cfg.tol)
    return {cls:'zero', val:money(0), exp:t('var_zero'), st:'matched'};
  const side = up? t('m_higher') : t('b_higher');
  let exp;
  if(day.kind==='missing_bank') exp=t('var_exp_nb');
  else if(day.status==='timing') exp=t('var_exp_timing',{d: day.links.map(l=>fmtDate(l.d)).join(', ')});
  else if(day.status==='pending') exp=t('var_exp_pending',{n:S.cfg.window});
  else if(day.status==='break')   exp=t('var_exp_break',{n:S.cfg.window});
  else exp='';
  return {cls: up?'pos':'neg', val:money(abs), exp: side+' — '+exp, st:day.status};
}

<script>
/* ==================================================================
   RECONCILE — merchant statement + bank statement -> one verdict
   Merchant side : Transaction Net Value summed by Statement Date.
   Bank side     : statement rows carrying "MID: n" where n is one of
                   the merchant numbers in the merchant statement,
                   netted Credit - Debit.
   Everything else is split into its own tab; internal own-account
   transfers are dropped entirely.
   ================================================================== */
const RX = {
  ins:  /;INS;/i,
  own:  /OWN\s*transfer/i,
  ipnfee:/IPN\s*BANK\s*FEE/i,
  fee:  /(statement posting|printing fees|account management|stamp duty|ledger fees|sms|commission on)/i,
  ext:  /(incoming domestic transfer|outgoing domestic transfer|ACH Transfer|CORP IPN|wire|swift)/i,
  upl:  /File\s*Uploading/i,
  cb:   /^\s*\|\s*\d{12,}\s*;/
};
const BUCKETS = ['psp','ins','cb','fees','ext','other'];

function classifyBankRow(desc, mid, msSet){
  if(mid) return msSet.has(mid) ? 'settlement' : 'psp';
  const s=String(desc||'');
  if(RX.ins.test(s))    return 'ins';
  if(RX.own.test(s))    return 'internal';
  if(RX.ipnfee.test(s)) return 'fees';
  if(RX.fee.test(s))    return 'fees';
  if(RX.ext.test(s))    return 'ext';
  if(RX.upl.test(s))    return 'cb';
  if(RX.cb.test(s))     return 'cb';
  return 'other';
}

/* ---------------------- merchant statement ---------------------- */
function readMerchant(parsed, fileName){
  let best=null;
  parsed.sheets.forEach(sh=>{
    for(let r=0;r<Math.min(40,sh.rows.length);r++){
      const c=sh.rows[r].map(x=>String(x==null?'':x).trim().toLowerCase());
      const net=c.indexOf('transaction net value'), sd=c.indexOf('statement date'), mn=c.indexOf('merchant number');
      if(net>=0&&sd>=0&&mn>=0){ best={sh,r,net,sd,mn,kind:'MS',
        st:c.indexOf('status'), nm:c.indexOf('merchant name')}; return; }
      const n2=c.indexOf('net_amount'), p2=c.indexOf('processing date'), m2=c.indexOf('merchant number');
      if(n2>=0&&p2>=0&&m2>=0 && !best){ best={sh,r,net:n2,sd:p2,mn:m2,kind:'TOOL',
        st:-1, nm:c.indexOf('merchant name')}; }
    }
  });
  if(!best) throw new Error('no_ms_header');
  const {sh,r,net,sd,mn,st,nm,kind}=best;
  const bySD={}, merchants=new Set(), statuses={};
  let n=0;
  for(let i=r+1;i<sh.rows.length;i++){
    const row=sh.rows[i];
    if(!row || row.every(x=>x===''||x==null)) continue;
    const d=normDate(row[sd]); if(!d) continue;
    bySD[d]=round2((bySD[d]||0)+num(row[net]));
    merchants.add(String(row[mn]).trim());
    if(st>=0){ const k=String(row[st]||'—'); statuses[k]=(statuses[k]||0)+1; }
    n++;
  }
  return { name:fileName, kind, bySD, merchants, statuses, rows:n,
           dates:Object.keys(bySD).sort(), sheet:sh.name };
}

/* ------------------------ bank statement ------------------------ */
function readBank(parsed, fileName, msSet){
  let best=null;
  parsed.sheets.forEach(sh=>{
    for(let r=0;r<Math.min(60,sh.rows.length);r++){
      const c=sh.rows[r].map(x=>String(x==null?'':x).trim().toLowerCase());
      const cr=c.indexOf('credit'), db=c.indexOf('debit'),
            tx=c.findIndex(x=>x.startsWith('transaction date'));
      if(cr>=0&&db>=0&&tx>=0){ best={sh,r,cr,db,tx,
        desc:c.indexOf('description'), ref:c.indexOf('transaction reference'),
        vd:c.findIndex(x=>x.startsWith('value date'))}; return; }
    }
  });
  if(!best) throw new Error('no_bank_header');
  const {sh,r,cr,db,tx,desc,ref,vd}=best;
  const days={}, items={}; BUCKETS.forEach(b=>items[b]=[]);
  let internal=0, internalAmt=0, total=0;
  const info={};
  sh.rows.slice(0,12).forEach(row=>row.forEach((c0,i)=>{
    const k=String(c0==null?'':c0).trim().replace(':','');
    if(/^(Account Number|Date From|Date To|Customer Name|Currency)$/i.test(k))
      info[k]=String(row[i+1]==null?'':row[i+1]).trim() || String(row[i+2]==null?'':row[i+2]).trim();
  }));
  for(let i=r+1;i<sh.rows.length;i++){
    const row=sh.rows[i];
    if(!row || row.every(x=>x===''||x==null)) continue;
    const d=normDate(row[tx]); if(!d) continue;
    const x=desc>=0? String(row[desc]||'') : '';
    const m=x.match(/MID:\s*(\d+)/);
    const mid=m?m[1]:null;
    const c=num(row[cr]), b=num(row[db]);
    total++;
    const bk=classifyBankRow(x, mid, msSet);
    if(bk==='internal'){ internal++; internalAmt+=c-b; continue; }
    if(bk==='settlement'){
      if(!days[d]) days[d]={n:0,cr:0,db:0};
      const a=days[d]; a.n++; a.cr+=c; a.db+=b;
    } else {
      items[bk].push({d, c, b, mid:mid||'', x, ref: ref>=0? String(row[ref]||''):'' ,
                      vd: vd>=0? normDate(row[vd])||'' : ''});
    }
  }
  Object.keys(days).forEach(d=>{ const a=days[d]; a.cr=round2(a.cr); a.db=round2(a.db); a.net=round2(a.cr-a.db); });
  return { name:fileName, days, items, internal, internalAmt:round2(internalAmt), total, info,
           dates:Object.keys(days).sort() };
}

/* -------------------------- the matcher --------------------------
   A bank day outside the merchant statement's own date range belongs
   to the neighbouring batch — it is reported as "not covered", not as
   a difference. Inside the range every bank day must be explained, so
   consecutive statement dates are accumulated until they equal it; a
   day that still cannot be made to match keeps the next statement
   date and reports the gap.
   ------------------------------------------------------------------ */
function matchDays(ms, bank){
  const sd=ms.dates.slice();
  const lo=sd[0], hi=sd[sd.length-1];
  const res=bank.dates.map(d=>({ d, bank:bank.days[d].net, rows:bank.days[d].n,
                                 msDates:[], merchant:null, diff:null,
                                 state:(d<lo||d>hi)?'edge':'open' }));
  let si=0;
  // pass 1 — exact, cumulative
  res.forEach(r=>{
    if(r.state!=='open') return;
    let acc=0, used=[], j=si;
    while(j<sd.length && Math.abs(acc-r.bank)>0.01){ acc=round2(acc+ms.bySD[sd[j]]); used.push(sd[j]); j++; }
    if(Math.abs(acc-r.bank)<=0.01 && used.length){
      si=j; r.msDates=used; r.merchant=acc; r.diff=0; r.state='matched';
    }
  });
  // pass 2 — whatever is still open inside the range is a real difference
  si=0;
  res.forEach(r=>{
    if(r.state==='matched'){ si+=r.msDates.length; return; }
    if(r.state!=='open') return;
    if(si<sd.length){
      r.msDates=[sd[si]]; r.merchant=ms.bySD[sd[si]];
      r.diff=round2(r.bank-r.merchant);
      r.state = Math.abs(r.diff)<=0.01 ? 'matched' : 'diff';
      si++;
    } else { r.state='edge'; }
  });
  const consumed=res.reduce((s,r)=>s+r.msDates.length,0);
  const leftover=sd.slice(consumed);
  return { rows:res, leftover, leftoverTotal: round2(leftover.reduce((s,k)=>s+ms.bySD[k],0)) };
}

let RC = { ms:null, bank:null, match:null, err:null, saved:false, wrote:0 };

function viewReconcile(el,R,sum){
  el.innerHTML='<div class="grid" style="gap:16px">'+
   '<div class="split">'+
     dropCard('rcMs','rcMsIn','.xlsx · .xls · .csv', t('rc_ms'), t('rc_ms_h'))+

   '</div>'+
   '<div id="rcOut"></div>'+
  '</div>';
  wireDrop('rcMs','rcMsIn', async f=>{
    setDrop('rcMs', t('psp_reading')+' '+f.name+'…');
    try{ RC.ms=readMerchant(await parseSpreadsheet(f), f.name); RC.err=null; RC.saved=false; }
    catch(e){ RC.ms=null; RC.err=e.message; }
    recompute();
  });
  wireDrop('rcBk','rcBkIn', async f=>{
    setDrop('rcBk', t('psp_reading')+' '+f.name+'…');
    try{ RC._bankFile=await parseSpreadsheet(f); RC._bankName=f.name; RC.err=null; RC.saved=false; }
    catch(e){ RC._bankFile=null; RC.err=e.message; }
    recompute();
  });
  paint();

  async function recompute(){
    if(RC._bankFile){
      try{ RC.bank=readBank(RC._bankFile, RC._bankName, RC.ms? RC.ms.merchants : new Set()); }
      catch(e){ RC.bank=null; RC.err=e.message; }
    }
    // the bank statement must belong to the account that is open
    const want=ACCOUNTS[S.acct].bank;
    if(RC.bank && want){
      const got=String(RC.bank.info['Account Number']||'').replace(/\s/g,'');
      if(got && got!==want){ RC.err='acct_mismatch'; RC.bank=null; RC.match=null; paint(); return; }
    }
    RC.match = (RC.ms&&RC.bank)? matchDays(RC.ms,RC.bank) : null;
    paint();
    if(RC.match && !RC.saved){ RC.saved=true; await autoRecord(); paint(); }
  }
  function paint(){
    setDrop('rcMs', RC.ms? fileLine(RC.ms.name, RC.ms.rows+' '+t('rc_txns')+' · '+RC.ms.dates.length+' '+t('rc_sdates')) : null);
    setDrop('rcBk', RC.bank? fileLine(RC.bank.name, (RC.bank.info['Account Number']||'')+' · '+RC.bank.total+' '+t('rc_txns')) : null);
    document.getElementById('rcOut').innerHTML = RC.err? errCard(RC.err) : (RC.match? resultHTML() : hintCard());
    bindResult();
  }
}

/* --------- the days go into the ledger the moment both files land --------- */
async function autoRecord(){
  if(!RC.ms||!RC.bank) return;
  // A bank day outside the merchant statement's range is only partly
  // understood: the merchant-number list that separates settlement from
  // PSP comes from that statement, so its settlement net would be wrong.
  // Those days are left for the upload that carries their own statement.
  const usable=new Set(RC.match.rows.filter(r=>r.state!=='edge').map(r=>r.d));
  const dates=Array.from(new Set([...RC.ms.dates, ...RC.bank.dates])).sort();
  let n=0;
  for(const d of dates){
    const mv = RC.ms.bySD[d];
    const bv = (RC.bank.days[d] && usable.has(d))? RC.bank.days[d].net : undefined;
    if(mv===undefined && bv===undefined) continue;
    const cur = rowsFor(S.acct).find(r=>r.d===d) || {};
    const nm = mv!==undefined? mv : (cur.m===undefined? null : cur.m);
    const nb = bv!==undefined? bv : (cur.b===undefined? null : cur.b);
    if(nm===(cur.m??null) && nb===(cur.b??null)) continue;   // nothing new for this day
    await saveDay(S.acct, d, { m:nm, b:nb, c:cur.c||'' });
    n++;
  }
  RC.wrote=n;
  toast(n? t('rc_recorded',{n}) : t('rc_already'));
}

/* --------------- the export workbook, in his own layout ---------------
   The first tab reproduces the master reconciliation sheet column for
   column; the tool's own settlement reading is added after Comment so
   the original seven columns stay exactly as they were.
   ---------------------------------------------------------------------- */
const MON_ABBR=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dmy(d){ const[y,mo,dd]=d.split('-'); return dd+'-'+MON_ABBR[+mo-1]+'-'+y; }
function higherLabel(mv,bv){
  if(mv==null&&bv==null) return 'No Data';
  if(bv==null) return 'Missing Bank';
  if(mv==null) return 'Missing Merchant';
  const df=round2(mv-bv);
  if(Math.abs(df)<=S.cfg.tol) return 'Equal';
  return df>0? 'Merchant Statement' : 'Bank Statement';
}
function higherPhrase(d,mv,bv){
  if(mv==null&&bv==null) return 'لا توجد بيانات';
  if(bv==null) return 'بيان البنك غير متوفر';
  if(mv==null) return 'بيان الميرشنت غير متوفر';
  const df=round2(mv-bv);
  if(Math.abs(df)<=S.cfg.tol) return 'Equal في '+dmy(d);
  return (df>0? 'Merchant أعلى في ' : 'Bank أعلى في ')+dmy(d);
}
function exportReconWorkbook(){
  if(!RC.match) return;
  const B=RC.bank, A=ACCOUNTS[S.acct];
  // run the engine over the whole ledger so a day that closes later says so
  const R=reconcile(rowsFor(S.acct), S.cfg);
  const byDate={}; R.days.forEach(x=>byDate[x.d]=x);
  const span=Array.from(new Set([...RC.ms.dates, ...B.dates])).sort();
  const from=span[0], to=span[span.length-1];
  const rows=R.days.filter(x=>x.d>=from && x.d<=to);

  const sheets=[];
  sheets.push({ name:'Reconciliation', colStyle:[1,2,2,2,0,0,0,0,0], rows:[
    ['Date','Merchant Statement','Bank Statement ',
     'Difference Between Bank & Merchant Statement',
     'Higher Bank & Merchant Statement','Date Bank & Merchant Statement','Comment',
     'Settlement status','Settled against'],
    ...rows.map(x=>[ x.d,
        x.m==null? '' : x.m,
        x.b==null? '' : x.b,
        x.diff==null? '' : x.diff,
        higherLabel(x.m,x.b),
        higherPhrase(x.d,x.m,x.b),
        x.c||'',
        x.status==='matched'?'Matched': x.status==='timing'?'Closed by a later day'
          : x.status==='pending'?'Still open': x.status==='break'?'Unreconciled break':'No data',
        x.links.length? x.links.map(l=>dmy(l.d)).join(' , ') : '' ]),
  ]});
  const hdr=['Credit','Debit','Date','Value date','MID','Description','Bank reference'];
  BUCKETS.forEach(b=>{
    const L=B.items[b]; if(!L.length) return;
    sheets.push({ name:TAB_NAME[b], colStyle:[2,2,1,1,0,0,0],
      rows:[hdr, ...L.slice().sort((a,c)=>a.d<c.d?-1:1).map(i=>[i.c,i.b,i.d,i.vd,i.mid,i.x,i.ref])]});
  });
  const blob=buildXLSX(sheets);
  const fn='REC BM '+A.en.replace(/ Settlement$/,'')+' '+dmy(from)+' to '+dmy(to)+' ACC '+A.code+'.xlsx';
  if(!IS_HOSTED){ saveBlob(fn, blob); toast(t('saved')); return; }
  (async()=>{
    let dl=null; try{ dl=await window.claude.use('downloads'); }catch(e){}
    if(dl){ try{ await dl.save({filename:fn, data:await blob.arrayBuffer()}); toast(t('saved')); return; }
            catch(e){ if(e&&e.code==='declined') return; } }
    const parts=[toCSV(sheets[0].rows[0], sheets[0].rows.slice(1))];
    BUCKETS.forEach(b=>{ const L=B.items[b]; if(!L.length) return;
      parts.push(''); parts.push('# '+TAB_NAME[b]);
      parts.push(toCSV(hdr, L.map(i=>[i.c,i.b,i.d,i.vd,i.mid,i.x,i.ref]))); });
    download(fn.replace(/\.xlsx$/,'.csv'), parts.join('\r\n'));
  })();
}
const TAB_NAME = { psp:'PSP', ins:'INS', cb:'Chargebacks', fees:'Bank Fees',
                   ext:'External Transfers', other:'Other' };

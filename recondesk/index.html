<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%230F161C'/%3E%3Cpath d='M12 21h16l7 11-7 11H12z' fill='%234F8FD1'/%3E%3Cpath d='M52 21H36l7 11-7 11h16z' fill='%23C08430'/%3E%3C/svg%3E">
<style>html{color-scheme:dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<title>ReconDesk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* ============ ReconDesk — dark-first token system ============ */
:root{
  color-scheme: dark;
  --ground:#0F161C; --surface:#151D24; --surface-2:#1B252E; --surface-3:#212D37;
  --line:#25313B; --line-strong:#35444F;
  --ink:#E6EDF3; --ink-dim:#93A4B1; --ink-faint:#6B7C89;
  --brand:#C08430; --brand-soft:#3A2C14; --brand-ink:#E0B368;
  --s-merchant:#4F8FD1; --s-bank:#C08430;
  --st-matched:#3E9E78; --st-timing:#8B80D6; --st-break:#D05B4A; --st-pending:#7A8B99;
  --st-matched-bg:#12291F; --st-timing-bg:#221F3A; --st-break-bg:#331815; --st-pending-bg:#1E262C;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.7);
  --focus:#E0B368;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --ground:#EFF0EC; --surface:#FBFAF7; --surface-2:#F3F3EF; --surface-3:#E9EAE4;
    --line:#DCDDD6; --line-strong:#C0C2B8;
    --ink:#161B1F; --ink-dim:#55606A; --ink-faint:#7C8892;
    --brand:#A66A1E; --brand-soft:#F6EEDF; --brand-ink:#8A570F;
    --s-merchant:#2E72B8; --s-bank:#A66A1E;
    --st-matched:#2F8A63; --st-timing:#6B5FC4; --st-break:#BF4E3C; --st-pending:#66727C;
    --st-matched-bg:#E4F1EA; --st-timing-bg:#ECEAF8; --st-break-bg:#FAE8E4; --st-pending-bg:#ECEEEF;
    --shadow:0 1px 2px rgba(20,24,28,.06), 0 8px 24px -14px rgba(20,24,28,.22);
    --focus:#8A570F;
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --ground:#EFF0EC; --surface:#FBFAF7; --surface-2:#F3F3EF; --surface-3:#E9EAE4;
  --line:#DCDDD6; --line-strong:#C0C2B8;
  --ink:#161B1F; --ink-dim:#55606A; --ink-faint:#7C8892;
  --brand:#A66A1E; --brand-soft:#F6EEDF; --brand-ink:#8A570F;
  --s-merchant:#2E72B8; --s-bank:#A66A1E;
  --st-matched:#2F8A63; --st-timing:#6B5FC4; --st-break:#BF4E3C; --st-pending:#66727C;
  --st-matched-bg:#E4F1EA; --st-timing-bg:#ECEAF8; --st-break-bg:#FAE8E4; --st-pending-bg:#ECEEEF;
  --shadow:0 1px 2px rgba(20,24,28,.06), 0 8px 24px -14px rgba(20,24,28,.22);
  --focus:#8A570F;
}
/* in-app toggle wins over host + OS, both directions */
:root[data-ui="dark"]{
  color-scheme: dark;
  --ground:#0F161C; --surface:#151D24; --surface-2:#1B252E; --surface-3:#212D37;
  --line:#25313B; --line-strong:#35444F;
  --ink:#E6EDF3; --ink-dim:#93A4B1; --ink-faint:#6B7C89;
  --brand:#C08430; --brand-soft:#3A2C14; --brand-ink:#E0B368;
  --s-merchant:#4F8FD1; --s-bank:#C08430;
  --st-matched:#3E9E78; --st-timing:#8B80D6; --st-break:#D05B4A; --st-pending:#7A8B99;
  --st-matched-bg:#12291F; --st-timing-bg:#221F3A; --st-break-bg:#331815; --st-pending-bg:#1E262C;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.7);
  --focus:#E0B368;
}
:root[data-ui="light"]{
  color-scheme: light;
  --ground:#EFF0EC; --surface:#FBFAF7; --surface-2:#F3F3EF; --surface-3:#E9EAE4;
  --line:#DCDDD6; --line-strong:#C0C2B8;
  --ink:#161B1F; --ink-dim:#55606A; --ink-faint:#7C8892;
  --brand:#A66A1E; --brand-soft:#F6EEDF; --brand-ink:#8A570F;
  --s-merchant:#2E72B8; --s-bank:#A66A1E;
  --st-matched:#2F8A63; --st-timing:#6B5FC4; --st-break:#BF4E3C; --st-pending:#66727C;
  --st-matched-bg:#E4F1EA; --st-timing-bg:#ECEAF8; --st-break-bg:#FAE8E4; --st-pending-bg:#ECEEEF;
  --shadow:0 1px 2px rgba(20,24,28,.06), 0 8px 24px -14px rgba(20,24,28,.22);
  --focus:#8A570F;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans","IBM Plex Sans Arabic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:13.5px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
:root[dir="rtl"] body, [dir="rtl"]{
  font-family:"IBM Plex Sans Arabic","IBM Plex Sans",-apple-system,sans-serif;
}
h1,h2,h3,h4{font-family:"IBM Plex Sans Condensed","IBM Plex Sans Arabic",sans-serif;font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.005em}
:root[dir="rtl"] h1,:root[dir="rtl"] h2,:root[dir="rtl"] h3,:root[dir="rtl"] h4{font-family:"IBM Plex Sans Arabic",sans-serif;letter-spacing:0}
.num{font-family:"IBM Plex Mono","IBM Plex Sans Arabic",ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:6px;border:3px solid var(--ground)}

/* ============ shell ============ */
.app{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
.rail{
  background:var(--surface);border-inline-end:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brandbox{padding:16px 16px 14px;border-bottom:1px solid var(--line)}
.wordmark{display:flex;align-items:center;gap:9px}
.mark{width:26px;height:26px;flex:none}
.wordmark .wm{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;font-size:17px;letter-spacing:.01em}
.wordmark .wm b{color:var(--brand-ink);font-weight:700}
.tagline{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);margin-top:5px;font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600}
:root[dir="rtl"] .tagline{letter-spacing:0;font-family:"IBM Plex Sans Arabic",sans-serif}

.acctswitch{padding:12px 12px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.acctbtn{
  display:flex;align-items:center;gap:9px;width:100%;text-align:start;
  background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:8px 10px;cursor:pointer;
  transition:border-color .12s,background .12s;
}
.acctbtn:hover{border-color:var(--line-strong)}
.acctbtn[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.acctbtn .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--s-merchant)}
.acctbtn[data-a="73"] .dot{background:var(--st-timing)}
.acctbtn[data-a="074"] .dot{background:var(--brand)}
.acctbtn .an{font-weight:600;font-size:12.5px;display:block;line-height:1.25}
.acctbtn .ac{font-size:10.5px;color:var(--ink-faint);font-family:"IBM Plex Mono",monospace}

.nav{padding:10px 8px;display:flex;flex-direction:column;gap:1px;flex:1}
.navbtn{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;
  background:none;border:0;cursor:pointer;color:var(--ink-dim);text-align:start;width:100%;font-size:13px;
  transition:background .12s,color .12s;
}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn[aria-current="page"]{background:var(--surface-3);color:var(--ink);font-weight:600}
.navbtn svg{width:16px;height:16px;flex:none;opacity:.85}
.navbtn .badge{margin-inline-start:auto;background:var(--st-break);color:#fff;border-radius:9px;padding:0 6px;font-size:10.5px;font-weight:600;min-width:18px;text-align:center}
:root[data-ui="light"] .navbtn .badge,:root[data-theme="light"] .navbtn .badge{color:#fff}

.railfoot{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:6px}
.iconbtn{
  background:var(--surface-2);border:1px solid var(--line);border-radius:6px;cursor:pointer;
  padding:6px 9px;font-size:11px;font-weight:600;color:var(--ink-dim);display:flex;align-items:center;gap:5px;
  transition:border-color .12s,color .12s;
}
.iconbtn:hover{border-color:var(--line-strong);color:var(--ink)}
.iconbtn svg{width:14px;height:14px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding:12px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.topbar h1{font-size:19px}
.topbar .sub{font-size:11.5px;color:var(--ink-faint);margin-top:1px}
.spacer{flex:1}
.content{padding:22px;max-width:1420px;width:100%;min-width:0}

/* ============ primitives ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:0}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card-h h3{font-size:13.5px}
.card-h .hint{font-size:11px;color:var(--ink-faint);font-weight:400;font-family:"IBM Plex Sans",sans-serif}
.card-b{padding:16px}
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.eyebrow{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;font-family:"IBM Plex Sans Condensed",sans-serif}
:root[dir="rtl"] .eyebrow{letter-spacing:0;font-family:"IBM Plex Sans Arabic",sans-serif}

.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.chip .cd{width:6px;height:6px;border-radius:50%;flex:none}
.chip.matched{background:var(--st-matched-bg);color:var(--st-matched);border-color:color-mix(in srgb,var(--st-matched) 30%,transparent)}
.chip.matched .cd{background:var(--st-matched)}
.chip.timing{background:var(--st-timing-bg);color:var(--st-timing);border-color:color-mix(in srgb,var(--st-timing) 30%,transparent)}
.chip.timing .cd{background:var(--st-timing)}
.chip.break{background:var(--st-break-bg);color:var(--st-break);border-color:color-mix(in srgb,var(--st-break) 34%,transparent)}
.chip.break .cd{background:var(--st-break)}
.chip.pending{background:var(--st-pending-bg);color:var(--st-pending);border-color:color-mix(in srgb,var(--st-pending) 30%,transparent)}
.chip.pending .cd{background:var(--st-pending)}

.btn{
  background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:7px 13px;
  font-size:12.5px;font-weight:600;cursor:pointer;transition:border-color .12s,background .12s;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{border-color:var(--line-strong)}
.btn svg{width:14px;height:14px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#12100C}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--st-break);border-color:color-mix(in srgb,var(--st-break) 40%,transparent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:11.5px;border-radius:6px}

input[type=text],input[type=number],input[type=date],input[type=month],select,textarea{
  background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:13px;width:100%;
}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none}
label.fl{display:block;font-size:11px;color:var(--ink-dim);margin-bottom:4px;font-weight:600}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px}
.seg button{background:none;border:0;border-radius:5px;padding:5px 11px;font-size:12px;cursor:pointer;color:var(--ink-dim);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--ink)}

/* ============ tables ============ */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{
  text-align:start;padding:8px 12px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-faint);font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap;
  position:sticky;top:0;background:var(--surface);z-index:2;
}
:root[dir="rtl"] th{letter-spacing:0}
td{padding:7px 12px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);white-space:nowrap}
tbody tr:hover{background:var(--surface-2)}
tr.clickable{cursor:pointer}
td.cmt{max-width:230px;overflow:hidden;text-overflow:ellipsis}
table.act td:last-child,table.act th:last-child{position:sticky;inset-inline-end:0;background:var(--surface);box-shadow:-6px 0 8px -8px rgba(0,0,0,.5)}
:root[dir="rtl"] table.act td:last-child,:root[dir="rtl"] table.act th:last-child{box-shadow:6px 0 8px -8px rgba(0,0,0,.5)}
table.act tbody tr:hover td:last-child{background:var(--surface-2)}
td.n,th.n{text-align:end;font-family:"IBM Plex Mono","IBM Plex Sans Arabic",monospace;font-variant-numeric:tabular-nums}
tr.sev-break td:first-child{box-shadow:inset 3px 0 0 var(--st-break)}
:root[dir="rtl"] tr.sev-break td:first-child{box-shadow:inset -3px 0 0 var(--st-break)}
.pos{color:var(--s-merchant)} .neg{color:var(--s-bank)} .zero{color:var(--ink-faint)}

/* ============ KPI ============ */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 15px;position:relative;overflow:hidden;min-width:0}
.kpi .k{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
:root[dir="rtl"] .kpi .k{letter-spacing:0}
.kpi .v{font-family:"IBM Plex Mono","IBM Plex Sans Arabic",monospace;font-size:23px;font-weight:600;margin-top:5px;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1.1}
.kpi .m{font-size:11px;color:var(--ink-faint);margin-top:4px}
.kpi.accent{border-color:color-mix(in srgb,var(--brand) 45%,transparent)}
.kpi.alarm .v{color:var(--st-break)}
.kpi.good .v{color:var(--st-matched)}

/* ============ charts ============ */
.chart{width:100%;display:block;overflow:visible;direction:ltr}
.chart text{font-family:"IBM Plex Mono",monospace;font-size:9.5px;fill:var(--ink-faint);direction:ltr;unicode-bidi:isolate}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .zl{stroke:var(--line-strong);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-dim);align-items:center}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-inline-end:5px;vertical-align:-1px}
.tip{
  position:fixed;pointer-events:none;z-index:100;background:var(--surface-3);border:1px solid var(--line-strong);
  border-radius:7px;padding:8px 10px;font-size:11.5px;box-shadow:var(--shadow);opacity:0;transition:opacity .09s;max-width:250px;
}
.tip.on{opacity:1}
.tip b{font-family:"IBM Plex Mono","IBM Plex Sans Arabic",monospace;font-variant-numeric:tabular-nums}
.tip .r{display:flex;justify-content:space-between;gap:14px;margin-top:3px}

/* heatmap */
.hm{display:flex;gap:14px;flex-wrap:wrap}
.hmm{}
.hmm .lbl{font-size:10.5px;color:var(--ink-faint);margin-bottom:5px;font-weight:600}
.hmg{display:grid;grid-template-columns:repeat(7,13px);grid-auto-rows:13px;gap:2px}
.hc{border-radius:2px;background:var(--surface-3);cursor:default}
.hc.matched{background:var(--st-matched)} .hc.timing{background:var(--st-timing)}
.hc.break{background:var(--st-break)} .hc.pending{background:var(--st-pending)}
.hc.nodata{background:var(--surface-3);opacity:.5}

.bar{height:7px;border-radius:4px;background:var(--surface-3);overflow:hidden;display:flex}
.bar span{height:100%}

.empty{text-align:center;padding:44px 20px;color:var(--ink-faint)}
.empty svg{width:34px;height:34px;opacity:.4;margin-bottom:10px}
.note{background:var(--surface-2);border:1px solid var(--line);border-inline-start:3px solid var(--brand);border-radius:7px;padding:10px 13px;font-size:12px;color:var(--ink-dim)}
.toast{
  position:fixed;bottom:20px;inset-inline-end:20px;background:var(--surface-3);border:1px solid var(--line-strong);
  border-radius:8px;padding:11px 15px;box-shadow:var(--shadow);z-index:200;font-size:12.5px;font-weight:600;
  transform:translateY(8px);opacity:0;transition:.18s;pointer-events:none;
}
.toast.on{transform:none;opacity:1}
.toast.err{border-color:var(--st-break);color:var(--st-break)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;max-width:620px;width:100%;max-height:86vh;overflow:auto;box-shadow:var(--shadow)}
[hidden]{display:none!important}

.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.f3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mono{font-family:"IBM Plex Mono","IBM Plex Sans Arabic",monospace;font-variant-numeric:tabular-nums}
.dim{color:var(--ink-dim)} .faint{color:var(--ink-faint)}
.sm{font-size:11.5px}

@media (max-width:1080px){ .split,.f3,.f2{grid-template-columns:minmax(0,1fr)} }
@media (max-width:820px){
  .app{grid-template-columns:1fr;max-width:100vw;overflow-x:hidden}
  .rail{position:relative;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;padding:8px;
        max-width:100vw;overflow-x:hidden}
  .brandbox,.acctswitch,.railfoot{border:0;padding:4px 8px}
  .acctswitch{flex-direction:row;min-width:0;flex:1 1 100%;overflow-x:auto;scrollbar-width:none}
  .acctbtn{flex:0 0 auto}
  .nav{flex-direction:row;overflow-x:auto;flex-wrap:nowrap;padding:4px;min-width:0;flex:1 1 100%;
       max-width:100%;scrollbar-width:none}
  .navbtn{white-space:nowrap;width:auto;flex:0 0 auto}
  .navbtn .badge{margin-inline-start:4px}
  .railfoot{flex:1 1 100%;border-top:1px solid var(--line)}
  .content{padding:14px}
  .topbar{padding:10px 14px}
  .kpi .v{font-size:20px}
  td.cmt{max-width:150px}
}

/* ============ record table: spreadsheet-style entry ============ */
.rt{width:100%;font-size:13px}
.rt th{padding:9px 12px}
.rt td{padding:0;height:38px;vertical-align:middle}
.rt td>.cv{padding:8px 12px;display:block;min-height:38px;display:flex;align-items:center;gap:7px}
.rt td.n>.cv{justify-content:flex-end}
.rt td.ed{cursor:text;position:relative}
.rt td.ed>.cv{border:1px solid transparent;border-radius:5px;margin:2px 4px;min-height:32px}
.rt td.ed:hover>.cv{border-color:var(--line-strong);background:var(--surface-2)}
.rt td.ed:hover>.cv::after{content:"";position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);
  width:5px;height:5px;border-radius:1px;background:var(--brand);opacity:.7}
.cellinput{width:calc(100% - 8px);margin:2px 4px;padding:6px 8px;border:1px solid var(--brand);border-radius:5px;
  background:var(--surface-3);font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-variant-numeric:tabular-nums}
.rt td.ed.txt .cellinput{font-family:"IBM Plex Sans","IBM Plex Sans Arabic",sans-serif}

/* variance cell — side tag + amount */
.side{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:4px;

const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

function monthKey(acct,ym){ return 'entries/'+acct+'_'+ym; }

async function initStore(){
  try{ S.db = await window.claude?.use?.('db'); }catch(e){ S.db=null; }
  if(S.db){
    setSync('ok', t('shared'));
    try{
      S.db.collection('entries').onSnapshot(snap=>{
        const next={ "120":{}, "73":{} };
        snap.docs.forEach(d=>{
          const id=d.id, data=d.data()||{};
          const acct=id.split('_')[0], ym=id.slice(acct.length+1);
          if(!next[acct]) return;
          const days=data.days||{};
          for(const dd in days) next[acct][ym+'-'+dd]=days[dd];
        });
        S.overrides=next; render();
      }, ()=>{ setSync('warn', t('local')); });
      S.db.collection('cases').onSnapshot(snap=>{
        const c={}; snap.docs.forEach(d=>{ c[d.id]=Object.assign({id:d.id}, d.data()); });
        S.cases=c; render();
      }, ()=>{});
      S.db.collection('psp').onSnapshot(snap=>{
        const next={}; snap.docs.forEach(d=>{ next[d.id]=(d.data()||{}).days||{}; });
        S.psp=next; render();
      }, ()=>{});
      S.db.collection('pspdet').onSnapshot(snap=>{
        const next={}; snap.docs.forEach(d=>{ next[d.id]=(d.data()||{}).days||{}; });
        S.pspdet=next; render();
      }, ()=>{});
      S.db.doc('config/settings').onSnapshot(snap=>{
        if(snap.exists){ const v=snap.data()||{};
          if(typeof v.window==='number') S.cfg.window=v.window;
          if(typeof v.tol==='number') S.cfg.tol=v.tol;
          render(); }
      }, ()=>{});
      S.dbReady=true;
    }catch(e){ S.db=null; }
  }
  if(!S.db){
    setSync('local', t('local'));
    S.overrides = LS.get('rd.overrides', {"120":{},"73":{}});
    S.cases     = LS.get('rd.cases', {});
    S.psp       = LS.get('rd.psp', {});
    S.pspdet    = LS.get('rd.pspdet', {});
    S.cfg       = Object.assign(S.cfg, LS.get('rd.cfg', {}));
    render();
  }
}
function setSync(kind,label){
  const d=document.getElementById('syncDot'), p=document.getElementById('syncPill');
  if(!d) return;
  d.style.background = kind==='ok'?'var(--st-matched)': kind==='local'?'var(--st-pending)':'var(--st-break)';
  if(p) p.title = label||'';
}

async function saveDay(acct, date, rec){
  const ym=date.slice(0,7), dd=date.slice(8,10);
  const stamped=Object.assign({}, rec, { u:S.initials||'', t:Date.now() });
  if(S.db){
    const ref=S.db.doc(monthKey(acct,ym));
    try{ await ref.update({ ['days.'+dd]: stamped }); }
    catch(e){
      const cur=(S.overrides[acct]||{});
      const days={};
      for(const k in cur) if(k.startsWith(ym+'-')) days[k.slice(8,10)]=cur[k];
      days[dd]=stamped;
      await ref.set({ days, acct, ym });
    }
  } else {
    S.overrides[acct][date]=stamped; LS.set('rd.overrides',S.overrides); render();
  }
}
async function deleteDay(acct,date){ await saveDay(acct,date,{del:true}); }

/* Patch one field of a day without disturbing the others — the merged row
   (seed or previously recorded) supplies every value we are not changing. */
async function patchDay(acct,date,patch){
  const cur = rowsFor(acct).find(r=>r.d===date) || {};
  await saveDay(acct,date,{
    m: ('m' in patch)? patch.m : (cur.m===undefined? null : cur.m),
    b: ('b' in patch)? patch.b : (cur.b===undefined? null : cur.b),
    c: ('c' in patch)? patch.c : (cur.c||'')
  });
}

async function saveCase(c){
  const id = c.id || ('c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
  const rec = Object.assign({}, c, { id });
  if(S.db){ await S.db.doc('cases/'+id).set(rec); }
  else { S.cases[id]=rec; LS.set('rd.cases',S.cases); render(); }
  return id;
}
async function removeCase(id){
  if(S.db){ await S.db.doc('cases/'+id).delete(); }
  else { delete S.cases[id]; LS.set('rd.cases',S.cases); render(); }
}
async function saveCfg(patch){
  Object.assign(S.cfg, patch);
  if(S.db){ try{ await S.db.doc('config/settings').set(S.cfg); }catch(e){} }
  else { LS.set('rd.cfg',S.cfg); }
  render();
}

/* --------------------- merge seed + overrides --------------------- */
function rowsFor(acct){
  const map=new Map();
  (SEED[acct]||[]).forEach(r=>{
    map.set(r[0], { d:r[0], m:(r[1]==null?null:r[1]), b:(r[2]==null?null:r[2]), c:r[3]||'', src:'seed' });
  });
  const ov=S.overrides[acct]||{};
  for(const date in ov){
    const o=ov[date]||{};
    if(o.del){ map.delete(date); continue; }
    map.set(date, {
      d:date,
      m:(o.m===undefined? (map.get(date)?.m ?? null) : (o.m===null?null:+o.m)),
      b:(o.b===undefined? (map.get(date)?.b ?? null) : (o.b===null?null:+o.b)),
      c:(o.c!==undefined? o.c : (map.get(date)?.c||'')),
      u:o.u||'', ts:o.t||0, src:'db'
    });
  }
  return Array.from(map.values()).sort((a,b)=> a.d<b.d?-1:1);
}

/* ==================================================================
   RECONCILIATION ENGINE
   Rolling FIFO offset matching. A daily variance is a timing
   difference if it is fully reversed by later days inside the
   settlement window; whatever survives the window is a real break.
   ================================================================== */
function reconcile(rows, cfg){
  const win = cfg.window, tol = cfg.tol;
  const days = rows.map(r=>{
    const hasM = r.m!==null && r.m!==undefined && !isNaN(r.m);
    const hasB = r.b!==null && r.b!==undefined && !isNaN(r.b);
    let kind='ok';
    if(!hasM && !hasB) kind='nodata';
    else if(!hasB) kind='missing_bank';
    else if(!hasM) kind='missing_merchant';
    const m = hasM? +r.m : 0, b = hasB? +r.b : 0;
    return { d:r.d, m:hasM?+r.m:null, b:hasB?+r.b:null, c:r.c||'', u:r.u||'', src:r.src,
             kind, diff: kind==='nodata'? null : round2(m-b),
             open:0, cleared:0, cum:0, status:'nodata', links:[] };
  });

  const queue=[]; const matches=[]; const opens=[];
  const lastIdx = days.length-1;

  for(let i=0;i<days.length;i++){
    const day=days[i];
    if(day.diff===null){ day.cum = i>0? days[i-1].cum : 0; continue; }

    // retire queue items that outlived the window (measured in days —
    // the ledger can skip dates, so row distance is not elapsed time)
    for(let q=queue.length-1;q>=0;q--){
      if(daysBetween(queue[q].date, day.d) > win){
        const it=queue.splice(q,1)[0];
        opens.push({ date:it.date, amt:it.amt, i:it.i, aged:true });
      }
    }

    let rem = day.diff;
    if(Math.abs(rem)<=tol){
      day.diff=0;
    } else {
      for(let q=0;q<queue.length && Math.abs(rem)>tol;q++){
        const it=queue[q];
        if((it.amt>0)===(rem>0)) continue;           // same sign, cannot offset
        const take=Math.min(Math.abs(it.amt),Math.abs(rem));
        matches.push({ from:it.date, to:day.d, amt:round2(take) });
        days[it.i].links.push({ d:day.d, amt:round2(take) });
        day.links.push({ d:it.date, amt:round2(take) });
        days[it.i].cleared = round2(days[it.i].cleared + take);
        day.cleared = round2(day.cleared + take);
        it.amt = round2(it.amt - (it.amt>0? take : -take));
        rem    = round2(rem   - (rem>0?  take : -take));
      }
      for(let q=queue.length-1;q>=0;q--) if(Math.abs(queue[q].amt)<=tol) queue.splice(q,1);
      if(Math.abs(rem)>tol) queue.push({ i, date:day.d, amt:round2(rem) });
    }
    day.cum = round2((i>0? days[i-1].cum : 0) + day.diff);
  }
  // whatever is still queued at the end
  const lastD = days.length? days[days.length-1].d : null;
  queue.forEach(it=>{
    const aged = lastD? (daysBetween(it.date, lastD) > win) : false;
    opens.push({ date:it.date, amt:it.amt, i:it.i, aged });
  });

  // Final classification. A day is only 'pending' or 'break' if an unmatched
  // remainder actually survives to the end — everything else settled.
  days.forEach(d=>{
    if(d.diff===null){ d.status='nodata'; d.open=0; return; }
    if(Math.abs(d.diff)<=tol){ d.status='matched'; d.open=0; return; }
    d.status='timing'; d.open=0;
  });
  opens.forEach(o=>{
    const d=days[o.i]; if(!d) return;
    d.open=o.amt; d.status = o.aged ? 'break' : 'pending';
  });

  opens.sort((a,b)=> a.date<b.date?-1:1);
  const lastDate = days.length? days[days.length-1].d : null;
  opens.forEach(o=>{ o.ageDays = lastDate? daysBetween(o.date, lastDate) : 0; });

  return { days, matches, opens, lastDate };
}
function round2(x){ return Math.round((x+Number.EPSILON)*100)/100; }

/* ---------------------- derived summaries ---------------------- */
function summarize(R){
  const d=R.days;
  const withData = d.filter(x=>x.diff!==null);
  const settled  = withData.filter(x=>x.status==='matched'||x.status==='timing').length;
  const totalM = d.reduce((s,x)=>s+(x.m||0),0);
  const totalB = d.reduce((s,x)=>s+(x.b||0),0);
  const aged   = R.opens.filter(o=>o.aged);
  const pend   = R.opens.filter(o=>!o.aged);
  return {
    daysCovered: withData.length,
    settled, health: withData.length? settled/withData.length : 0,
    totalM, totalB, net: round2(totalM-totalB),
    agedCount: aged.length, agedNet: round2(aged.reduce((s,o)=>s+o.amt,0)),
    agedAbs: round2(aged.reduce((s,o)=>s+Math.abs(o.amt),0)),
    pendCount: pend.length, pendNet: round2(pend.reduce((s,o)=>s+o.amt,0)),
    missingBank: d.filter(x=>x.kind==='missing_bank').length,
    missingMerch: d.filter(x=>x.kind==='missing_merchant').length,
    noData: d.filter(x=>x.kind==='nodata').length,
    lastDate: R.lastDate,
    counts: {
      matched: d.filter(x=>x.status==='matched').length,
      timing:  d.filter(x=>x.status==='timing').length,
      pending: d.filter(x=>x.status==='pending').length,
      break:   d.filter(x=>x.status==='break').length,
      nodata:  d.filter(x=>x.status==='nodata').length
    }
  };
}
function monthlyRollup(R){
  const map=new Map();
  R.days.forEach(x=>{
    const ym=x.d.slice(0,7);
    if(!map.has(ym)) map.set(ym,{ym,m:0,b:0,diff:0,days:0,matched:0,timing:0,pending:0,brk:0,missing:0});
    const o=map.get(ym);
    o.m+=x.m||0; o.b+=x.b||0;
    if(x.diff!==null){ o.diff+=x.diff; o.days++; }
    if(x.status==='matched')o.matched++; else if(x.status==='timing')o.timing++;
    else if(x.status==='pending')o.pending++; else if(x.status==='break')o.brk++;
    if(x.kind==='missing_bank')o.missing++;
  });
  return Array.from(map.values()).map(o=>({...o,m:round2(o.m),b:round2(o.b),diff:round2(o.diff)}));
}
function yearlyRollup(R){
  const map=new Map();
  R.days.forEach(x=>{
    const y=x.d.slice(0,4);
    if(!map.has(y)) map.set(y,{y,m:0,b:0,diff:0,days:0,brk:0,missing:0});
    const o=map.get(y); o.m+=x.m||0; o.b+=x.b||0;
    if(x.diff!==null){ o.diff+=x.diff; o.days++; }
    if(x.status==='break')o.brk++;
    if(x.kind==='missing_bank')o.missing++;
  });
  return Array.from(map.values()).map(o=>({...o,m:round2(o.m),b:round2(o.b),diff:round2(o.diff)}));
}

<script>
/* ==================================================================
   Spreadsheet I/O — self-contained, no external libraries.
   Reads Banque Misr statements in .xls (BIFF8 inside an OLE2
   compound file) and .xlsx / .csv. Writes multi-sheet .xlsx.
   ================================================================== */

/* ------------------------------ CFB (OLE2) ------------------------------ */
function cfbRead(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf);
  const sig=[0xD0,0xCF,0x11,0xE0,0xA1,0xB1,0x1A,0xE1];
  for(let i=0;i<8;i++) if(u8[i]!==sig[i]) throw new Error('not_ole2');
  const ssz=1<<dv.getUint16(30,true), mssz=1<<dv.getUint16(32,true);
  const nFat=dv.getUint32(44,true), dirStart=dv.getUint32(48,true);
  const miniCut=dv.getUint32(56,true), miniStart=dv.getUint32(60,true);
  const difStart=dv.getUint32(68,true), nDif=dv.getUint32(72,true);
  const sectOff=s=> (s+1)*ssz;

  // DIFAT -> list of FAT sectors
  const fatSecs=[];
  for(let i=0;i<109;i++){ const v=dv.getUint32(76+4*i,true); if(v<0xFFFFFFFA) fatSecs.push(v); }
  let ds=difStart, guard=0;
  while(ds<0xFFFFFFFA && guard++<nDif+64){
    const base=sectOff(ds), n=(ssz/4)-1;
    for(let i=0;i<n;i++){ const v=dv.getUint32(base+4*i,true); if(v<0xFFFFFFFA) fatSecs.push(v); }
    ds=dv.getUint32(base+4*n,true);
  }
  const fat=[];
  fatSecs.forEach(fs=>{ const b=sectOff(fs); for(let i=0;i<ssz/4;i++) fat.push(dv.getUint32(b+4*i,true)); });

  const chain=(start,tbl)=>{ const out=[]; let c=start, g=0;
    while(c<0xFFFFFFFA && g++<1e6){ out.push(c); c=tbl[c]; if(c===undefined) break; } return out; };
  const readSectors=(start,size)=>{
    const secs=chain(start,fat), out=new Uint8Array(secs.length*ssz);
    secs.forEach((s,i)=>out.set(u8.subarray(sectOff(s),sectOff(s)+ssz), i*ssz));
    return size!=null? out.subarray(0,size) : out;
  };

  // directory
  const dir=readSectors(dirStart,null), entries=[];
  for(let off=0; off+128<=dir.length; off+=128){
    const nl=dir[off+64]|(dir[off+65]<<8); if(nl<=0||nl>64) { entries.push(null); continue; }
    let name=''; for(let i=0;i<nl-2;i+=2) name+=String.fromCharCode(dir[off+i]|(dir[off+i+1]<<8));
    const type=dir[off+66];
    const start=dir[off+116]|(dir[off+117]<<8)|(dir[off+118]<<16)|(dir[off+119]<<24);
    const size =(dir[off+120]|(dir[off+121]<<8)|(dir[off+122]<<16)|(dir[off+123]<<24))>>>0;
    entries.push({name,type,start:start>>>0,size});
  }
  const root=entries.find(e=>e&&e.type===5);

  // miniFAT + mini stream (only built if needed)
  let miniFat=null, miniStream=null;
  const ensureMini=()=>{
    if(miniFat) return;
    miniFat=[]; const secs=chain(miniStart,fat);
    secs.forEach(s=>{ const b=sectOff(s); for(let i=0;i<ssz/4;i++) miniFat.push(dv.getUint32(b+4*i,true)); });
    miniStream=readSectors(root.start, root.size);
  };
  const readEntry=e=>{
    if(e.size>=miniCut || e===root) return readSectors(e.start,e.size);
    ensureMini();
    const secs=chain(e.start,miniFat), out=new Uint8Array(secs.length*mssz);
    secs.forEach((s,i)=>out.set(miniStream.subarray(s*mssz,(s+1)*mssz), i*mssz));
    return out.subarray(0,e.size);
  };
  return { entries:entries.filter(Boolean), read:readEntry };
}

/* ------------------------------ BIFF8 ------------------------------ */
function rkToNum(rk){
  const fx100=rk&1, fInt=rk&2, v=rk & 0xFFFFFFFC;
  let n;
  if(fInt){ n = (rk|0)>>2; }
  else { const b=new ArrayBuffer(8), d=new DataView(b);
         d.setUint32(0,0,true); d.setUint32(4,v>>>0,true); n=d.getFloat64(0,true); }
  return fx100? n/100 : n;
}
function biffString(dv,u8,pos,cch,rich,ext){
  // returns {text, next} handling CONTINUE boundaries is done by caller slicing
  let s='', p=pos;
  const grbit=u8[p++]; const wide=grbit&1, isRich=grbit&8, isExt=grbit&4;
  let cRun=0, cbExt=0;
  if(isRich){ cRun=dv.getUint16(p,true); p+=2; }
  if(isExt){ cbExt=dv.getInt32(p,true); p+=4; }
  for(let i=0;i<cch;i++){ if(wide){ s+=String.fromCharCode(dv.getUint16(p,true)); p+=2; } else { s+=String.fromCharCode(u8[p]); p+=1; } }
  p+=cRun*4+cbExt;
  return {text:s,next:p};
}
function parseXLS(buf){
  const cfb=cfbRead(buf);
  const wbe=cfb.entries.find(e=>e.name==='Workbook'||e.name==='Book');
  if(!wbe) throw new Error('no_workbook_stream');
  const raw=cfb.read(wbe);
  const u8=new Uint8Array(raw.buffer, raw.byteOffset, raw.length);
  const dv=new DataView(raw.buffer, raw.byteOffset, raw.length);

  // pass 1: records index, SST, boundsheets
  const recs=[];
  for(let off=0; off+4<=u8.length;){
    const id=dv.getUint16(off,true), len=dv.getUint16(off+2,true);
    recs.push({id,off:off+4,len}); off+=4+len;
    if(len<0) break;
  }
  // SST (+CONTINUE) — rebuild the shared string table
  const sst=[];
  for(let i=0;i<recs.length;i++){
    if(recs[i].id!==0x00FC) continue;
    // stitch SST with its CONTINUE records, remembering each chunk boundary
    const chunks=[{off:recs[i].off,len:recs[i].len}];
    let j=i+1; while(j<recs.length && recs[j].id===0x003C){ chunks.push({off:recs[j].off,len:recs[j].len}); j++; }

    chunks.forEach(c=>{ starts.push(w); flat.set(u8.subarray(c.off,c.off+c.len), w); w+=c.len; });
    const fdv=new DataView(flat.buffer);
    const nUnique=fdv.getInt32(4,true);
    let p=8;
    const inSameChunk=(a,b)=>{ // true if [a,b) does not cross a chunk boundary
      for(const s of starts) if(s>a && s<b) return false; return true; };
    const chunkEnd=a=>{ for(const s of starts) if(s>a) return s; return total; };

      const cch=fdv.getUint16(p,true); p+=2;
      let grbit=flat[p++]; let wide=grbit&1; const isRich=grbit&8, isExt=grbit&4;
      let cRun=0, cbExt=0;
      if(isRich){ cRun=fdv.getUint16(p,true); p+=2; }
      if(isExt){ cbExt=fdv.getInt32(p,true); p+=4; }
      let s='', got=0;
      while(got<cch){
        const end=chunkEnd(p);
        const room=wide? Math.floor((end-p)/2) : (end-p);
        const take=Math.min(cch-got, room);
        for(let q=0;q<take;q++){ if(wide){ s+=String.fromCharCode(fdv.getUint16(p,true)); p+=2; } else { s+=String.fromCharCode(flat[p]); p+=1; } }
        got+=take;
        if(got<cch){ // crossed into a CONTINUE: a fresh grbit byte leads it
          p=end; grbit=flat[p++]; wide=grbit&1;
        }
      }
      p+=cRun*4+cbExt;
      sst.push(s);
    }
    break;
  }
  // boundsheets
  const sheets=[];
  recs.forEach(r=>{
    if(r.id!==0x0085) return;
    const pos=dv.getUint32(r.off,true);
    const cch=u8[r.off+6], grbit=u8[r.off+7]; let name='', p=r.off+8;
    for(let i=0;i<cch;i++){ if(grbit&1){ name+=String.fromCharCode(dv.getUint16(p,true)); p+=2; } else { name+=String.fromCharCode(u8[p]); p+=1; } }
    sheets.push({name, pos, rows:[]});
  });
  if(!sheets.length) sheets.push({name:'Sheet1',pos:-1,rows:[]});

  // pass 2: cells per worksheet substream
  const recAt=pos=>{ for(let i=0;i<recs.length;i++) if(recs[i].off-4===pos) return i; return -1; };
  sheets.forEach(sh=>{
    let i = sh.pos>=0? recAt(sh.pos) : 0;
    if(i<0) return;
    const grid=new Map(); let maxC=0;
    const put=(r,c,v)=>{ if(!grid.has(r)) grid.set(r,new Map()); grid.get(r).set(c,v); if(c>maxC) maxC=c; };
    for(i=i+1;i<recs.length;i++){
      const R=recs[i]; const o=R.off;
      if(R.id===0x000A) break;                       // EOF
      if(R.id===0x0809 && i>0) { /* nested BOF */ }
      switch(R.id){
        case 0x00FD:{ const r=dv.getUint16(o,true),c=dv.getUint16(o+2,true),isst=dv.getUint32(o+6,true);
          put(r,c,sst[isst]!==undefined? sst[isst] : ''); break; }
        case 0x027E:{ const r=dv.getUint16(o,true),c=dv.getUint16(o+2,true);
          put(r,c,rkToNum(dv.getUint32(o+6,true))); break; }
        case 0x00BD:{ const r=dv.getUint16(o,true); let c=dv.getUint16(o+2,true); let p=o+4;
          while(p+6<=o+R.len){ put(r,c,rkToNum(dv.getUint32(p+2,true))); p+=6; c++; } break; }
        case 0x0203:{ const r=dv.getUint16(o,true),c=dv.getUint16(o+2,true);
          put(r,c,dv.getFloat64(o+6,true)); break; }
        case 0x0201: case 0x00BE: break;              // BLANK / MULBLANK
        case 0x0204:{ const r=dv.getUint16(o,true),c=dv.getUint16(o+2,true);
          const cch=dv.getUint16(o+6,true); put(r,c,biffString(dv,u8,o+8,cch).text); break; }
        case 0x0006:{ const r=dv.getUint16(o,true),c=dv.getUint16(o+2,true);
          if(!(u8[o+12]===0xFF && u8[o+13]===0xFF)) put(r,c,dv.getFloat64(o+6,true)); break; }
      }
    }
    const maxR=grid.size? Math.max(...grid.keys()) : -1;
    for(let r=0;r<=maxR;r++){
      const row=[]; const g=grid.get(r);
      for(let c=0;c<=maxC;c++) row.push(g&&g.has(c)? g.get(c) : '');
      sh.rows.push(row);
    }
  });
  return { sheets:sheets.map(s=>({name:s.name, rows:s.rows})) };
}

/* ------------------------------ ZIP / XLSX ------------------------------ */
async function unzip(buf){
  const u8=new Uint8Array(buf), dv=new DataView(buf);
  let eocd=-1;
  for(let i=u8.length-22;i>=0 && i>u8.length-66000;i--){
    if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; }
  }
  if(eocd<0) throw new Error('not_zip');
  const n=dv.getUint16(eocd+10,true); let p=dv.getUint32(eocd+16,true);
  const files={};
  for(let k=0;k<n;k++){
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true);
    const nlen=dv.getUint16(p+28,true), elen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true);
    const lho=dv.getUint32(p+42,true);
    let name=''; for(let i=0;i<nlen;i++) name+=String.fromCharCode(u8[p+46+i]);
    const lnl=dv.getUint16(lho+26,true), lel=dv.getUint16(lho+28,true);
    const dstart=lho+30+lnl+lel;
    const comp=u8.subarray(dstart,dstart+csize);
    files[name]= method===0? comp.slice()
      : await new Response(new Blob([comp]).stream().pipeThrough(new DecompressionStream('deflate-raw')))
          .arrayBuffer().then(b=>new Uint8Array(b));
    p+=46+nlen+elen+clen;
  }
  const dec=new TextDecoder();
  const out={}; for(const k in files) out[k]=files[k];
  out.__text=k=>files[k]? dec.decode(files[k]) : null;
  return out;
}
function colToIdx(ref){ let s=ref.match(/^[A-Z]+/)[0], n=0;
  for(let i=0;i<s.length;i++) n=n*26+(s.charCodeAt(i)-64); return n-1; }
async function parseXLSX(buf){
  const z=await unzip(buf);
  const wbXml=z.__text('xl/workbook.xml'); if(!wbXml) throw new Error('not_xlsx');
  const relsXml=z.__text('xl/_rels/workbook.xml.rels')||'';
  const rels={}; (relsXml.match(/<Relationship\b[^>]*>/g)||[]).forEach(r=>{
    const id=(r.match(/Id="([^"]+)"/)||[])[1], tg=(r.match(/Target="([^"]+)"/)||[])[1];
    if(id&&tg) rels[id]= tg.replace(/^\/?xl\//,'').replace(/^\//,'');
  });
  const shared=[]; const ssXml=z.__text('xl/sharedStrings.xml');
  if(ssXml){ (ssXml.match(/<si>[\s\S]*?<\/si>|<si\/>/g)||[]).forEach(si=>{
    const parts=si.match(/<t[^>]*>([\s\S]*?)<\/t>/g)||[];
    shared.push(parts.map(t=>t.replace(/<[^>]+>/g,'')).join('').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'"));
  }); }
  const sheets=[];
  (wbXml.match(/<sheet\b[^>]*\/>/g)||[]).forEach(s=>{
    const name=(s.match(/name="([^"]*)"/)||[])[1]||'Sheet';
    const rid=(s.match(/r:id="([^"]+)"/)||[])[1];
    const path='xl/'+(rels[rid]||'');
    const xml=z.__text(path); if(xml==null) return;
    const rows=[];
    (xml.match(/<row\b[\s\S]*?(?:\/>|<\/row>)/g)||[]).forEach(rx=>{
      const rn=+((rx.match(/ r="(\d+)"/)||[])[1]||rows.length+1);
      const row=[];
      (rx.match(/<c\b[\s\S]*?(?:\/>|<\/c>)/g)||[]).forEach(cx=>{
        const ref=(cx.match(/ r="([A-Z]+\d+)"/)||[])[1];
        const ci=ref? colToIdx(ref) : row.length;
        const ty=(cx.match(/ t="([^"]+)"/)||[])[1]||'n';
        let v='';
        if(ty==='inlineStr'){ const m=cx.match(/<t[^>]*>([\s\S]*?)<\/t>/); v=m? m[1]:''; }
        else { const m=cx.match(/<v>([\s\S]*?)<\/v>/); const raw=m? m[1]:'';
               v = ty==='s' ? (shared[+raw]??'') : ty==='str' ? raw : (raw===''? '' : +raw); }
        if(typeof v==='string') v=v.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
        while(row.length<ci) row.push('');
        row[ci]=v;
      });
      while(rows.length<rn-1) rows.push([]);
      rows[rn-1]=row;
    });
    const w=Math.max(0,...rows.map(r=>r.length));
    sheets.push({name, rows:rows.map(r=>{ const c=r.slice(); while(c.length<w) c.push(''); return c; })});
  });
  return {sheets};
}
function parseCSVText(txt){
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<txt.length;i++){ const ch=txt[i];
    if(q){ if(ch==='"'){ if(txt[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','||ch==='\t'){ row.push(cur); cur=''; }
    else if(ch==='\n'){ row.push(cur); cur=''; rows.push(row); row=[]; }
    else if(ch!=='\r') cur+=ch;
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  const w=Math.max(0,...rows.map(r=>r.length));
  return {sheets:[{name:'CSV',rows:rows.map(r=>{const c=r.slice(); while(c.length<w)c.push(''); return c;})}]};
}
async function parseSpreadsheet(file){
  const buf=await file.arrayBuffer();
  const u8=new Uint8Array(buf);
  if(u8[0]===0xD0&&u8[1]===0xCF) return parseXLS(buf);
  if(u8[0]===0x50&&u8[1]===0x4B) return parseXLSX(buf);
  return parseCSVText(new TextDecoder().decode(buf));
}

/* ------------------------------ XLSX writer ------------------------------ */
const CRC_T=(()=>{ const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c=CRC_T[(c^u8[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zipStore(files){ // [{name, data:Uint8Array}] -> Blob (stored, no compression)
  const enc=new TextEncoder(); const locals=[], central=[]; let off=0;
  files.forEach(f=>{
    const nm=enc.encode(f.name), crc=crc32(f.data), sz=f.data.length;
    const lh=new Uint8Array(30+nm.length); const ld=new DataView(lh.buffer);
    ld.setUint32(0,0x04034b50,true); ld.setUint16(4,20,true); ld.setUint16(6,0,true);
    ld.setUint16(8,0,true); ld.setUint16(10,0,true); ld.setUint16(12,0,true);
    ld.setUint32(14,crc,true); ld.setUint32(18,sz,true); ld.setUint32(22,sz,true);
    ld.setUint16(26,nm.length,true); ld.setUint16(28,0,true); lh.set(nm,30);
    locals.push(lh,f.data);
    const ch=new Uint8Array(46+nm.length); const cd=new DataView(ch.buffer);
    cd.setUint32(0,0x02014b50,true); cd.setUint16(4,20,true); cd.setUint16(6,20,true);
    cd.setUint16(8,0,true); cd.setUint16(10,0,true); cd.setUint16(12,0,true); cd.setUint16(14,0,true);
    cd.setUint32(16,crc,true); cd.setUint32(20,sz,true); cd.setUint32(24,sz,true);
    cd.setUint16(28,nm.length,true); cd.setUint32(42,off,true); ch.set(nm,46);
    central.push(ch);
    off+=lh.length+sz;
  });
  let cs=0; central.forEach(c=>cs+=c.length);
  const eo=new Uint8Array(22); const ed=new DataView(eo.buffer);
  ed.setUint32(0,0x06054b50,true); ed.setUint16(8,files.length,true); ed.setUint16(10,files.length,true);
  ed.setUint32(12,cs,true); ed.setUint32(16,off,true);
  return new Blob([...locals,...central,eo],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
const xe = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function safeSheetName(n){ return String(n).replace(/[\[\]\*\/\\\?:]/g,'-').slice(0,31); }
function buildXLSX(sheets){ // [{name, rows:[[v,...]]}]
  const enc=new TextEncoder(), files=[];
  const A=i=>{ let s='',n=i+1; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-1-m)/26; } return s; };
  const used=new Set();
  const names=sheets.map(s=>{ let n=safeSheetName(s.name),i=2;
    while(used.has(n.toLowerCase())){ n=safeSheetName(s.name).slice(0,28)+'('+(i++)+')'; } used.add(n.toLowerCase()); return n; });
  files.push({name:'[Content_Types].xml', data:enc.encode(
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
    '<Default Extension="xml" ContentType="application/xml"/>'+
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+
    sheets.map((s,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')+
    '</Types>')});
  files.push({name:'_rels/.rels', data:enc.encode(
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'+
    '</Relationships>')});
  files.push({name:'xl/workbook.xml', data:enc.encode(
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '+
    'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+
    names.map((n,i)=>'<sheet name="'+xe(n)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')+
    '</sheets></workbook>')});
  files.push({name:'xl/_rels/workbook.xml.rels', data:enc.encode(
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    sheets.map((s,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('')+
    '<Relationship Id="rIdS" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'+
    '</Relationships>')});
  files.push({name:'xl/styles.xml', data:enc.encode(
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    '<numFmts count="1"><numFmt numFmtId="164" formatCode="dd-mmm-yyyy"/></numFmts>'+
    '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font>'+
    '<font><b/><sz val="11"/><name val="Calibri"/></font></fonts>'+
    '<fills count="2"><fill><patternFill patternType="none"/></fill>'+
    '<fill><patternFill patternType="gray125"/></fill></fills>'+
    '<borders count="1"><border/></borders>'+
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'+
    '<cellXfs count="4">'+
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'+
      '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>'+
      '<xf numFmtId="4" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>'+
      '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>'+
    '</cellXfs>'+
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>'+
    '</styleSheet>')});
  const serial=d=>{ const t=Date.parse(d+'T00:00:00Z'); return isNaN(t)? null : t/86400000+25569; };
  sheets.forEach((s,si)=>{
    const cs=s.colStyle||[];           // 1 = date, 2 = amount, 0/absent = general
    const hb=s.boldHeader!==false;
    const rows=s.rows.map((row,ri)=>{
      const cells=row.map((v,ci)=>{
        if(v===null||v===undefined||v==='') return '';
        const ref=A(ci)+(ri+1);
        let st = (ri===0&&hb)? 3 : (cs[ci]||0);
        if(ri>0 && st===1 && typeof v==='string'){
          const n=serial(v);
          if(n!==null) return '<c r="'+ref+'" s="1"><v>'+n+'</v></c>';
          st=0;
        }
        if(typeof v==='number' && isFinite(v))
          return '<c r="'+ref+'"'+(st?' s="'+st+'"':'')+'><v>'+v+'</v></c>';
        return '<c r="'+ref+'"'+((ri===0&&hb)?' s="3"':'')+' t="inlineStr"><is><t>'+xe(v)+'</t></is></c>';
      }).join('');
      return '<row r="'+(ri+1)+'">'+cells+'</row>';
    }).join('');
    files.push({name:'xl/worksheets/sheet'+(si+1)+'.xml', data:enc.encode(
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+rows+'</sheetData></worksheet>')});
  });
  return zipStore(files);
}
</script>

<script>
/* ==================== tiny chart layer (SVG) ==================== */
const TIP = () => document.getElementById('tip');
function showTip(html, ev){
  const el=TIP(); el.innerHTML=html; el.classList.add('on');
  const pad=14, w=el.offsetWidth, h=el.offsetHeight;
  let x=ev.clientX+pad, y=ev.clientY-h-pad;
  if(x+w>innerWidth-8) x=ev.clientX-w-pad;
  if(y<8) y=ev.clientY+pad;
  el.style.left=x+'px'; el.style.top=y+'px';
}
function hideTip(){ TIP().classList.remove('on'); }

function cssv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function svg(tag,attrs){ const e=document.createElementNS('http://www.w3.org/2000/svg',tag);
  for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }
function niceTicks(min,max,n){
  if(min===max){ min-=1; max+=1; }
  const span=max-min, step0=span/n, mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const norm=step0/mag; const step=(norm<=1?1:norm<=2?2:norm<=5?5:10)*mag;
  const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step;
  const out=[]; for(let v=lo;v<=hi+step/2;v+=step) out.push(+v.toFixed(10));
  return out;
}

/* ---- diverging area: cumulative position over time ---- */
function chartRolling(host, days){
  const pts = days.filter(d=>d.diff!==null).map(d=>({d:d.d, v:d.cum}));
  if(pts.length<2){ host.innerHTML='<div class="empty">'+t('nothing')+'</div>'; return; }
  const W=Math.max(320, host.clientWidth||600), H=210, mT=12, mB=24, mL=58, mR=10;
  const iw=W-mL-mR, ih=H-mT-mB;
  const vals=pts.map(p=>p.v); const lo=Math.min(0,...vals), hi=Math.max(0,...vals);
  const ticks=niceTicks(lo,hi,4); const y0=ticks[0], y1=ticks[ticks.length-1];
  const X=i=> mL + (i/(pts.length-1))*iw;
  const Y=v=> mT + ih - ((v-y0)/(y1-y0))*ih;
  const s=svg('svg',{class:'chart',viewBox:`0 0 ${W} ${H}`,width:'100%',height:H,role:'img'});
  ticks.forEach(v=>{
    s.appendChild(svg('line',{class:v===0?'zl':'gl',x1:mL,x2:W-mR,y1:Y(v),y2:Y(v)}));
    const tx=svg('text',{x:mL-8,y:Y(v)+3,'text-anchor':'end'}); tx.textContent=compact(v); s.appendChild(tx);
  });
  const zy=Y(0);
  let dTop='', dBot='', line='';
  pts.forEach((p,i)=>{ line += (i?'L':'M')+X(i)+','+Y(p.v); });
  // clip halves
  const cid='c'+Math.random().toString(36).slice(2,7);
  const defs=svg('defs',{});
  [['t',mT,Math.max(0,zy-mT)],['b',zy,Math.max(0,mT+ih-zy)]].forEach(([k,yy,hh])=>{
    const cp=svg('clipPath',{id:cid+k}); cp.appendChild(svg('rect',{x:mL,y:yy,width:iw,height:hh})); defs.appendChild(cp);
  });
  s.appendChild(defs);
  const areaD = 'M'+X(0)+','+zy+' '+pts.map((p,i)=>'L'+X(i)+','+Y(p.v)).join(' ')+' L'+X(pts.length-1)+','+zy+' Z';
  s.appendChild(svg('path',{d:areaD,fill:'var(--s-merchant)','fill-opacity':.20,'clip-path':`url(#${cid}t)`}));
  s.appendChild(svg('path',{d:areaD,fill:'var(--s-bank)','fill-opacity':.20,'clip-path':`url(#${cid}b)`}));
  s.appendChild(svg('path',{d:line,fill:'none',stroke:'var(--ink-dim)','stroke-width':2,'stroke-linejoin':'round'}));
  const last=pts[pts.length-1];
  s.appendChild(svg('circle',{cx:X(pts.length-1),cy:Y(last.v),r:4,fill:last.v>=0?'var(--s-merchant)':'var(--s-bank)',stroke:'var(--surface)','stroke-width':2}));
  // x labels
  [0,Math.floor(pts.length/2),pts.length-1].forEach(i=>{
    const tx=svg('text',{x:X(i),y:H-7,'text-anchor':i===0?'start':i===pts.length-1?'end':'middle'});
    tx.textContent=pts[i].d.slice(0,7); s.appendChild(tx);
  });
  const cross=svg('line',{class:'zl',y1:mT,y2:mT+ih,opacity:0,stroke:'var(--brand)'});
  s.appendChild(cross);
  const hit=svg('rect',{x:mL,y:mT,width:iw,height:ih,fill:'transparent',style:'cursor:crosshair'});
  s.appendChild(hit);
  hit.addEventListener('mousemove',ev=>{
    const r=s.getBoundingClientRect(); const rel=(ev.clientX-r.left)*(W/r.width);
    let i=Math.round(((rel-mL)/iw)*(pts.length-1)); i=Math.max(0,Math.min(pts.length-1,i));
    cross.setAttribute('x1',X(i)); cross.setAttribute('x2',X(i)); cross.setAttribute('opacity',.75);
    const p=pts[i];
    showTip('<b>'+fmtDate(p.d)+'</b><div class="r"><span>'+t('net_position')+'</span><b>'+money(p.v)+'</b></div>',ev);
  });
  hit.addEventListener('mouseleave',()=>{ cross.setAttribute('opacity',0); hideTip(); });
  host.innerHTML=''; host.appendChild(s);
}

/* ---- grouped bars: merchant vs bank per month ---- */
function chartMonthly(host, rows){
  if(!rows.length){ host.innerHTML='<div class="empty">'+t('nothing')+'</div>'; return; }
  const W=Math.max(320,host.clientWidth||600), H=230, mT=12,mB=30,mL=58,mR=10;
  const iw=W-mL-mR, ih=H-mT-mB;
  const hi=Math.max(...rows.map(r=>Math.max(r.m,r.b)));
  const ticks=niceTicks(0,hi,4), y1=ticks[ticks.length-1];
  const Y=v=> mT+ih-(v/y1)*ih;
  const gw=iw/rows.length, bw=Math.max(4,Math.min(22,(gw-10)/2));
  const s=svg('svg',{class:'chart',viewBox:`0 0 ${W} ${H}`,width:'100%',height:H});
  ticks.forEach(v=>{ s.appendChild(svg('line',{class:'gl',x1:mL,x2:W-mR,y1:Y(v),y2:Y(v)}));
    const tx=svg('text',{x:mL-8,y:Y(v)+3,'text-anchor':'end'}); tx.textContent=compact(v); s.appendChild(tx); });
  rows.forEach((r,i)=>{
    const cx=mL+gw*i+gw/2;
    [['m','var(--s-merchant)',-1],['b','var(--s-bank)',1]].forEach(([k,col,side])=>{
      const v=r[k], h=Math.max(1,(v/y1)*ih);
      const x=cx+(side<0? -bw-1 : 1);
      const rect=svg('rect',{x,y:Y(v),width:bw,height:h,rx:3,fill:col});
      rect.addEventListener('mousemove',ev=>showTip(
        '<b>'+fmtMonth(r.ym)+'</b>'+
        '<div class="r"><span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--s-merchant)"></i> '+t('merchant')+'</span><b>'+money0(r.m)+'</b></div>'+
        '<div class="r"><span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--s-bank)"></i> '+t('bank')+'</span><b>'+money0(r.b)+'</b></div>'+
        '<div class="r"><span>'+t('variance')+'</span><b>'+money(r.diff)+'</b></div>',ev));
      rect.addEventListener('mouseleave',hideTip);
      s.appendChild(rect);
    });
    if(rows.length<=14 || i%2===0){
      const tx=svg('text',{x:cx,y:H-16,'text-anchor':'middle'}); tx.textContent=monName(+r.ym.slice(5,7)-1); s.appendChild(tx);
      const ty=svg('text',{x:cx,y:H-5,'text-anchor':'middle',opacity:.6}); ty.textContent=r.ym.slice(2,4); s.appendChild(ty);
    }
  });
  host.innerHTML=''; host.appendChild(s);
}

/* ---- diverging daily variance bars ---- */
function chartVariance(host, days){
  const pts=days.filter(d=>d.diff!==null);
  if(!pts.length){ host.innerHTML='<div class="empty">'+t('nothing')+'</div>'; return; }
  const W=Math.max(320,host.clientWidth||600), H=190, mT=10,mB=22,mL=58,mR=10;
  const iw=W-mL-mR, ih=H-mT-mB;
  const mx=Math.max(1,...pts.map(p=>Math.abs(p.diff)));
  const ticks=niceTicks(-mx,mx,4); const y0=ticks[0],y1=ticks[ticks.length-1];
  const Y=v=> mT+ih-((v-y0)/(y1-y0))*ih;
  const bw=Math.max(1.2,Math.min(9,iw/pts.length-1));
  const s=svg('svg',{class:'chart',viewBox:`0 0 ${W} ${H}`,width:'100%',height:H});
  ticks.forEach(v=>{ s.appendChild(svg('line',{class:v===0?'zl':'gl',x1:mL,x2:W-mR,y1:Y(v),y2:Y(v)}));
    const tx=svg('text',{x:mL-8,y:Y(v)+3,'text-anchor':'end'}); tx.textContent=compact(v); s.appendChild(tx); });
  const zy=Y(0);
  pts.forEach((p,i)=>{
    if(Math.abs(p.diff)<0.005) return;
    const x=mL+(i/pts.length)*iw;
    const y=p.diff>0? Y(p.diff): zy, h=Math.max(1.5,Math.abs(zy-Y(p.diff)));
    const col = p.status==='break'? 'var(--st-break)' : (p.diff>0?'var(--s-merchant)':'var(--s-bank)');
    const r=svg('rect',{x,y,width:bw,height:h,rx:1.5,fill:col,'fill-opacity':p.status==='break'?1:.8});
    r.addEventListener('mousemove',ev=>showTip('<b>'+fmtDate(p.d)+'</b>'+
      '<div class="r"><span>'+t('merchant')+'</span><b>'+money(p.m)+'</b></div>'+
      '<div class="r"><span>'+t('bank')+'</span><b>'+money(p.b)+'</b></div>'+
      '<div class="r"><span>'+t('difference')+'</span><b>'+money(p.diff)+'</b></div>'+
      '<div class="r"><span>'+t('status')+'</span><b>'+t('st_'+(p.status==='break'?'break':p.status))+'</b></div>',ev));
    r.addEventListener('mouseleave',hideTip);
    s.appendChild(r);
  });
  [0,pts.length-1].forEach(i=>{ const tx=svg('text',{x:mL+(i/pts.length)*iw,y:H-6,'text-anchor':i?'end':'start'});
    tx.textContent=pts[i].d.slice(0,7); s.appendChild(tx); });
  host.innerHTML=''; host.appendChild(s);
}

/* ---- stacked composition bar (status mix) ---- */
function barMix(counts){
  const order=[['matched','--st-matched'],['timing','--st-timing'],['pending','--st-pending'],['break','--st-break']];
  const total=order.reduce((s,[k])=>s+(counts[k]||0),0)||1;
  return '<div class="bar">'+order.map(([k,c])=>{
    const v=counts[k]||0; if(!v) return '';
    return '<span style="width:'+(v/total*100)+'%;background:var('+c+')" title="'+t(k==='break'?'brk':k)+': '+v+'"></span>';
  }).join('')+'</div>';
}
function legendStatus(){
  return '<div class="legend">'+
   [['matched','--st-matched'],['timing','--st-timing'],['pending','--st-pending'],['brk','--st-break']]
   .map(([k,c])=>'<span><i style="background:var('+c+')"></i>'+t(k)+'</span>').join('')+'</div>';
}
function legendSeries(){
  return '<div class="legend">'+
   '<span><i style="background:var(--s-merchant)"></i>'+t('merchant')+'</span>'+
   '<span><i style="background:var(--s-bank)"></i>'+t('bank')+'</span></div>';
}

/* ---- calendar heatmap ---- */
function heatmap(days, fromYm){
  const byDate={}; days.forEach(d=>byDate[d.d]=d);
  const months=[...new Set(days.map(d=>d.d.slice(0,7)))].filter(m=>!fromYm||m>=fromYm);
  return '<div class="hm">'+months.map(ym=>{
    const [y,m]=ym.split('-').map(Number);
    const first=new Date(Date.UTC(y,m-1,1)), dim=new Date(Date.UTC(y,m,0)).getUTCDate();
    let cells='';
    for(let i=0;i<first.getUTCDay();i++) cells+='<div></div>';
    for(let dd=1;dd<=dim;dd++){
      const iso=ym+'-'+String(dd).padStart(2,'0'); const rec=byDate[iso];
      const st=rec? rec.status : 'nodata';
      const tt = rec && rec.diff!==null
        ? fmtDate(iso)+' · '+t('st_'+(st==='break'?'break':st))+' · '+money(rec.diff)
        : fmtDate(iso)+' · '+t('st_nodata');
      cells+='<div class="hc '+st+'" title="'+esc(tt)+'"></div>';
    }
    return '<div class="hmm"><div class="lbl">'+monName(m-1)+" '"+String(y).slice(2)+'</div><div class="hmg">'+cells+'</div></div>';
  }).join('')+'</div>';
}
</script>

/* --------------------------- CSV / export --------------------------- */
function toCSV(headers, rows){
  const q=v=>{ const s=(v==null?'':String(v)); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  return '﻿'+[headers.map(q).join(','),...rows.map(r=>r.map(q).join(','))].join('\r\n');
}
function saveBlob(filename, blob){
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}
async function download(filename, text){
  if(!IS_HOSTED){ saveBlob(filename, new Blob([text],{type:'text/csv;charset=utf-8'})); toast(t('saved')); return; }
  let dl=null; try{ dl=await window.claude?.use?.('downloads'); }catch(e){}
  if(dl){ try{ await dl.save({filename, data:text}); toast(t('saved')); return; }
    catch(e){ if(e && e.code==='declined') return; } }
  modal(filename,'<p class="sm dim">'+t('copy')+'</p><textarea rows="12" style="font-family:IBM Plex Mono,monospace;font-size:11px">'+esc(text)+'</textarea>',
    '<button class="btn primary" id="cpx">'+t('copy')+'</button>');
  document.getElementById('cpx').onclick=()=>{ const ta=document.querySelector('#mdl textarea'); ta.select();
    try{document.execCommand('copy'); toast(t('copied'));}catch(e){} };
}
function exportLedger(acct,R){
  const rows=R.days.map(d=>[d.d, d.m==null?'':d.m, d.b==null?'':d.b, d.diff==null?'':d.diff,
    t('st_'+(d.status==='break'?'break':d.status)), d.open||'', d.links.map(l=>l.d).join(' / '), d.c||'', d.u||'']);
  download('ReconDesk_'+acct+'_ledger.csv',
    toCSV([t('date'),t('merchant'),t('bank'),t('difference'),t('status'),t('open_items'),t('settled_via'),t('comment'),t('recorded')],rows));
}
function exportAll(){
  const parts=[];
  ACCT_ORDER.forEach(a=>{
    const R=reconcile(rowsFor(a),S.cfg);
    parts.push('# '+ACCOUNTS[a].en+' ('+a+')');
    parts.push(toCSV([t('date'),t('merchant'),t('bank'),t('difference'),t('status'),t('comment')],
      R.days.map(d=>[d.d,d.m==null?'':d.m,d.b==null?'':d.b,d.diff==null?'':d.diff,d.status,d.c||''])));
    parts.push('');
  });
  download('ReconDesk_full_export.csv', parts.join('\r\n'));

/* ==================================================================
   Record table — one row per day, edited in place like a spreadsheet.
   Clicking a figure turns it into an input; Enter saves, Esc cancels.
   Only the field you touched changes; everything else on that day stays.
   ================================================================== */
function varianceInner(d){
  if(d.diff===null) return '<span class="zero">—</span>';
  if(Math.abs(d.diff)<=S.cfg.tol) return '<span class="zero">0.00</span>';
  const up=d.diff>0;
  return '<span class="side '+(up?'m':'b')+'">'+(up?'M':'B')+'</span>'+
    '<span class="vamt '+(up?'pos':'neg')+'">'+money(Math.abs(d.diff))+'</span>';
}
function statusSub(d){
  if(d.open) return t('open_short')+' '+money(Math.abs(d.open));
  if(d.links.length) return t('settled_short')+' '+d.links.map(l=>fmtDate(l.d).replace(/ \d{4}$/,'')).join(', ');
  if(d.kind==='missing_bank') return t('no_stmt');
  if(d.kind==='missing_merchant') return t('no_mstmt');
  return '';
}
function varianceCell(d){
  const ttl = d.diff===null||Math.abs(d.diff)<=S.cfg.tol ? t('var_none') : (d.diff>0? t('m_higher'):t('b_higher'));
  return '<td class="n" title="'+esc(ttl)+'"><span class="cv">'+varianceInner(d)+'</span></td>';
}
function statusCell(d){
  const sub=statusSub(d);
  return '<td class="st"><span class="cv">'+chip(d.status)+
    (sub?'<span class="stsub">'+esc(sub)+'</span>':'')+'</span></td>';
}
function editCell(d, field, cls){
  const raw = field==='c' ? (d.c||'') : (d[field]===null||d[field]===undefined? '' : d[field]);
  const shown = field==='c' ? esc(d.c||'') : money(d[field]);
  return '<td class="ed '+(cls||'')+'" data-cell="'+field+'" data-date="'+d.d+'" data-raw="'+esc(raw)+'"'+
    ' title="'+esc(t('tip_edit'))+'"><span class="cv">'+(shown===''? '<span class="faint">+</span>' : shown)+'</span></td>';
}

     '<span><span class="side m">M</span> <b>'+t('lg_m')+'</b></span>'+
     '<span><span class="side b">B</span> <b>'+t('lg_b')+'</b></span>'+
     '<span>'+legendStatus()+'</span>'+
     '<span style="margin-inline-start:auto">'+t('lg_click')+'</span>'+

function bindRecordTable(el, R){
  // inline edit
  el.querySelectorAll('td.ed').forEach(td=>{
    td.onclick=()=>{
      if(td.querySelector('input')) return;
      const field=td.dataset.cell, date=td.dataset.date, acct=S.acct;
      const inp=document.createElement('input');
      inp.className='cellinput';
      if(field==='c'){ inp.type='text'; } else { inp.type='number'; inp.step='0.01'; }
      inp.value=td.dataset.raw||'';
      td.innerHTML=''; td.appendChild(inp); inp.focus(); inp.select();
      let done=false;
      const finish=async commit=>{
        if(done) return; done=true;
        if(commit){
          const v = field==='c' ? inp.value : (inp.value.trim()===''? null : +inp.value);
          if(String(v??'')!==String(td.dataset.raw||'')){ await patchDay(acct,date,{[field]:v}); toast(t('saved')); }
        }
        render();
      };
      inp.onblur=()=>finish(true);
      inp.onkeydown=e=>{
        if(e.key==='Enter'){ e.preventDefault(); finish(true); }
        else if(e.key==='Escape'){ e.preventDefault(); finish(false); }
      };
    };
  });
  // delete a day
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    if(!confirm(t('confirm_del_day')+' '+fmtDate(b.dataset.del)+'?')) return;
    await deleteDay(S.acct,b.dataset.del); toast(t('deleted'));
  });
  // new-row
  const gv=id=>document.getElementById(id);
  if(!gv('nrAdd')) return;
  const prev=()=>{
    const d=gv('nrD').value, m=gv('nrM').value, b=gv('nrB').value;
    const box=gv('nrPrev');
    if(!d || (m===''&&b==='')){ box.innerHTML='<span class="faint sm">'+t('var_exp_nodata')+'</span>'; return; }
    const base=rowsFor(S.acct).filter(r=>r.d!==d);
    base.push({d, m:m===''?null:+m, b:b===''?null:+b, c:gv('nrC').value});
    base.sort((x,y)=>x.d<y.d?-1:1);
    const rr=reconcile(base,S.cfg), day=rr.days.find(x=>x.d===d);
    if(!day){ box.innerHTML=''; return; }
    const sub=statusSub(day);
    box.innerHTML='<span style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">'+
      varianceInner(day)+chip(day.status)+
      (sub?'<span class="stsub" style="margin:0">'+esc(sub)+'</span>':'')+'</span>';
  };
  ['nrD','nrM','nrB','nrC'].forEach(id=>{ const e=gv(id); if(e) e.oninput=prev; });
  ['nrM','nrB','nrC'].forEach(id=>{ const e=gv(id); if(e) e.onkeydown=ev=>{ if(ev.key==='Enter') gv('nrAdd').click(); }; });
  gv('nrAdd').onclick=async()=>{
    const d=gv('nrD').value;
    if(!d){ toast(t('entry_date'),true); return; }
    const m=gv('nrM').value, b=gv('nrB').value;
    await saveDay(S.acct,d,{ m:m.trim()===''?null:+m, b:b.trim()===''?null:+b, c:gv('nrC').value });
    toast(t('saved')); render();
  };
  prev();
}

خلال المطابقة اليومية لحساب ${ac.ar} (${ac.ar2}) تبيّن وجود ${aged.length} فرق تسوية لم يتم عكسها خلال نافذة الإقفال (${S.cfg.window} أيام) ولا تزال مفتوحة:

صافي الرصيد المفتوح: ${money(aged.reduce((s,o)=>s+o.amt,0))} ج.م

برجاء المراجعة وإفادتنا بمعالجة التسوية لتواريخ القيمة أعلاه، أو موافاتنا بمراجع القيد المقابلة.

<script>
/* ==================================================================
   PSP Commission (ACC 074)
   Bank statement -> one sheet per Transaction Date, copied verbatim.
   A day is only workable once the following day exists in the
   statement — otherwise that day is not yet closed.
   ================================================================== */
const PSP='074';

let STMT = null;   // { name, days:{ 'YYYY-MM-DD': [[credit,debit],...] }, dates:[], meta:{} }
let PSPSEL = {};   // date -> bool

/* ---------------------------- storage ---------------------------- */
function pspRows(){                       // merged day records for ACC 074
  const out=[];
  for(const ym in (S.psp||{})){
    const days=S.psp[ym]||{};
    for(const dd in days){ const v=days[dd]; out.push(Object.assign({d:ym+'-'+dd}, v)); }
  }
  return out.sort((a,b)=> a.d<b.d?-1:1);
}
async function savePspDay(date, rec, detail){
  const ym=date.slice(0,7), dd=date.slice(8,10);
  const stamped=Object.assign({}, rec, {u:S.initials||'', t:Date.now()});
  if(S.db){
    try{ await S.db.doc('psp/'+ym).update({['days.'+dd]:stamped}); }
    catch(e){ const cur=(S.psp&&S.psp[ym])||{}; const days=Object.assign({},cur); days[dd]=stamped;
              await S.db.doc('psp/'+ym).set({days, ym}); }
    if(detail){
      try{ await S.db.doc('pspdet/'+ym).update({['days.'+dd]:detail}); }
      catch(e){ try{ const cur=(S.pspdet&&S.pspdet[ym])||{}; const days=Object.assign({},cur); days[dd]=detail;
                     await S.db.doc('pspdet/'+ym).set({days, ym}); }catch(e2){} }
    }
  } else {
    S.psp[ym]=S.psp[ym]||{}; S.psp[ym][dd]=stamped; LS.set('rd.psp',S.psp);
    if(detail){ S.pspdet[ym]=S.pspdet[ym]||{}; S.pspdet[ym][dd]=detail; LS.set('rd.pspdet',S.pspdet); }
    render();
  }
}
async function deletePspDay(date){
  const ym=date.slice(0,7), dd=date.slice(8,10);
  if(S.db){
    const cur=Object.assign({},(S.psp&&S.psp[ym])||{}); delete cur[dd];
    try{ await S.db.doc('psp/'+ym).set({days:cur, ym}); }catch(e){}
    const cd=Object.assign({},(S.pspdet&&S.pspdet[ym])||{}); delete cd[dd];
    try{ await S.db.doc('pspdet/'+ym).set({days:cd, ym}); }catch(e){}
  } else {
    if(S.psp[ym]) delete S.psp[ym][dd]; if(S.pspdet[ym]) delete S.pspdet[ym][dd];
    LS.set('rd.psp',S.psp); LS.set('rd.pspdet',S.pspdet); render();
  }
}
function pspDetail(date){
  const ym=date.slice(0,7), dd=date.slice(8,10);
  return (S.pspdet&&S.pspdet[ym]&&S.pspdet[ym][dd]) || null;
}

/* --------------------------- statement --------------------------- */
function excelSerialToISO(n){
  const ms=Math.round((n-25569)*86400000);
  return new Date(ms).toISOString().slice(0,10);
}
function normDate(v){
  if(v===null||v===undefined||v==='') return null;
  if(typeof v==='number'){ if(v>20000&&v<80000) return excelSerialToISO(v); return null; }
  const s=String(v).trim();
  let m=s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if(m) return m[1]+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[3]).padStart(2,'0');
  m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
  if(m) return m[3]+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0');
  const t=Date.parse(s); if(!isNaN(t)) return new Date(t).toISOString().slice(0,10);
  return null;
}
function num(v){ if(typeof v==='number') return v;
  const s=String(v==null?'':v).replace(/[,\s]/g,''); if(s===''||s==='-') return 0;
  const n=parseFloat(s); return isNaN(n)?0:n; }

function readStatement(parsed, fileName){
  // locate the header row: must carry Credit, Debit and a transaction-date column
  let best=null;
  parsed.sheets.forEach(sh=>{
    for(let r=0;r<Math.min(60,sh.rows.length);r++){
      const cells=sh.rows[r].map(x=>String(x==null?'':x).trim().toLowerCase());
      const iC=cells.findIndex(x=>x==='credit');
      const iD=cells.findIndex(x=>x==='debit');
      const iT=cells.findIndex(x=>x.startsWith('transaction date'));
      const iV=cells.findIndex(x=>x.startsWith('value date'));
      if(iC>=0&&iD>=0&&iT>=0){ best={sh,r,iC,iD,iT,iV}; return; }
    }
  });
  if(!best) throw new Error('no_header');
  const {sh,r,iC,iD,iT,iV}=best;
  const days={}, meta={sheet:sh.name, header:r+1, cols:{credit:iC+1,debit:iD+1,txn:iT+1}};
  let skipped=0, total=0;
  for(let i=r+1;i<sh.rows.length;i++){
    const row=sh.rows[i];
    if(!row || row.every(x=>x===''||x===null||x===undefined)) continue;
    const d=normDate(row[iT]);
    if(!d){ skipped++; continue; }
    (days[d]=days[d]||[]).push([num(row[iC]), num(row[iD])]);
    total++;
  }
  // statement window, for the closure check
  const dates=Object.keys(days).sort();
  const stmtInfo={};
  parsed.sheets[0].rows.slice(0,12).forEach(row=>row.forEach((c,i)=>{
    const k=String(c==null?'':c).trim();
    if(/^(Account Number|Customer Name|Currency|Date From|Date To|Opening Balance|Current Balance):?$/i.test(k))
      stmtInfo[k.replace(':','')]=String(row[i+1]==null?'':row[i+1]).trim() || String(row[i+2]==null?'':row[i+2]).trim();
  }));
  return { name:fileName, days, dates, meta:Object.assign(meta,{skipped,total,info:stmtInfo}) };
}
function dayTotals(rows){
  let cr=0, db=0;
  rows.forEach(([c,d])=>{ cr+=c; db+=d; });
  return { n:rows.length, cr:round2(cr), db:round2(db), net:round2(cr-db) };
}
function isClosed(dates, d){ return dates.indexOf(addDaysISO(d,1))>=0; }
const MON_SHORT=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pspSheetName(d){ const[y,m,dd]=d.split('-'); return 'PSP Comm - '+dd+' '+MON_SHORT[+m-1]+' '+y; }

/* ----------------------------- export ----------------------------- */
function pspSheetsFor(dates){
  return dates.map(d=>{
    const rows = (STMT && STMT.days[d]) || pspDetail(d) || [];
    return { name:pspSheetName(d), rows:[['Credit','Debit'], ...rows] };
  });
}
async function exportPspWorkbook(dates){
  const sheets=pspSheetsFor(dates);
  if(!sheets.length){ toast(t('nothing'),true); return; }
  const blob=buildXLSX(sheets);
  const fn='REC BM PSP '+dates.map(d=>d.slice(8,10)).join(', ')+' '+
    MON_SHORT[+dates[0].slice(5,7)-1]+' '+dates[0].slice(0,4)+' ACC 074.xlsx';
  if(!IS_HOSTED){
    const url=URL.createObjectURL(blob); const a=document.createElement('a');
    a.href=url; a.download=fn; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000); toast(t('saved')); return;
  }
  let dl=null; try{ dl=await window.claude.use('downloads'); }catch(e){}
  if(dl){ try{ await dl.save({filename:fn, data:await blob.arrayBuffer()}); toast(t('saved')); return; }
          catch(e){ if(e&&e.code==='declined') return; } }
  exportPspCSV(dates);
}
function exportPspCSV(dates){
  const parts=[];
  dates.forEach(d=>{
    const rows=(STMT&&STMT.days[d])||pspDetail(d)||[];
    parts.push('# '+pspSheetName(d));
    parts.push(toCSV(['Credit','Debit'], rows.map(r=>[r[0],r[1]])));
    parts.push('');
  });
  download('REC BM PSP '+dates[0]+(dates.length>1?'_'+dates[dates.length-1]:'')+' ACC 074.csv', parts.join('\r\n'));
}
function copyDay(d){
  const rows=(STMT&&STMT.days[d])||pspDetail(d)||[];
  const tsv=['Credit\tDebit', ...rows.map(r=>r[0]+'\t'+r[1])].join('\n');
  const ta=document.createElement('textarea'); ta.value=tsv;
  ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast(t('copied')); }catch(e){ toast(t('copied'),true); }
  ta.remove();
}

/* ============================ PSP VIEWS ============================ */
function pspSummary(){
  const rows=pspRows();
  const byMonth=new Map();
  rows.forEach(r=>{ const ym=r.d.slice(0,7);
    if(!byMonth.has(ym)) byMonth.set(ym,{ym,cr:0,db:0,net:0,n:0,days:0});
    const o=byMonth.get(ym); o.cr+=r.cr; o.db+=r.db; o.net+=r.net; o.n+=r.n; o.days++; });
  const byYear=new Map();
  rows.forEach(r=>{ const y=r.d.slice(0,4);
    if(!byYear.has(y)) byYear.set(y,{y,cr:0,db:0,net:0,n:0,days:0});
    const o=byYear.get(y); o.cr+=r.cr; o.db+=r.db; o.net+=r.net; o.n+=r.n; o.days++; });
  const tot=rows.reduce((a,r)=>({cr:a.cr+r.cr, db:a.db+r.db, net:a.net+r.net, n:a.n+r.n}),{cr:0,db:0,net:0,n:0});
  return { rows, months:[...byMonth.values()].map(o=>({...o,cr:round2(o.cr),db:round2(o.db),net:round2(o.net)})),
           years:[...byYear.values()].map(o=>({...o,cr:round2(o.cr),db:round2(o.db),net:round2(o.net)})),
           tot:{cr:round2(tot.cr),db:round2(tot.db),net:round2(tot.net),n:tot.n} };
}

function viewPspDashboard(el){
  const P=pspSummary();
  const last=P.rows[P.rows.length-1];
  const lastMonth=P.months[P.months.length-1];
  const avg = P.rows.length? P.tot.net/P.rows.length : 0;
  const biggest = P.rows.slice().sort((a,b)=>b.net-a.net)[0];
  el.innerHTML='<div class="grid" style="gap:16px">'+
   '<div class="kpis">'+
    kpi(t('psp_total'), money0(P.tot.net), t('psp_net_h'), 'accent')+
    kpi(t('psp_days'), P.rows.length, t('psp_txns')+': '+NF0.format(P.tot.n))+
    kpi(t('psp_avg'), money0(avg), t('psp_avg_h'))+
    kpi(t('psp_month'), lastMonth? money0(lastMonth.net):'—', lastMonth? fmtMonth(lastMonth.ym):'')+
    kpi(t('psp_debits'), money0(P.tot.db), t('psp_debits_h'), P.tot.db?'alarm':'')+
    kpi(t('kpi_lastday'), last? fmtDate(last.d):'—', last? (daysBetween(last.d,todayISO())+' '+t('days')+' '+t('since')):'')+
   '</div>'+
   (P.rows.length? ''
     : '<div class="note">'+t('psp_empty')+'</div>')+
   (P.months.length? '<div class="card"><div class="card-h"><h3>'+t('psp_monthly')+'</h3>'+

/* single-series bar chart */
function chartBars(host, pts, color, dense){
  if(!host) return;
  if(!pts.length){ host.innerHTML='<div class="empty">'+t('nothing')+'</div>'; return; }
  const W=Math.max(320,host.clientWidth||600), H=210, mT=12,mB=30,mL=62,mR=10;
  const iw=W-mL-mR, ih=H-mT-mB;
  const hi=Math.max(0,...pts.map(p=>p.v)), lo=Math.min(0,...pts.map(p=>p.v));
  const ticks=niceTicks(lo,hi,4), y0=ticks[0], y1=ticks[ticks.length-1];
  const Y=v=> mT+ih-((v-y0)/(y1-y0))*ih;
  const gw=iw/pts.length, bw=Math.max(1.5,Math.min(dense?7:26, gw-(dense?1:6)));
  const s=svg('svg',{class:'chart',viewBox:`0 0 ${W} ${H}`,width:'100%',height:H});
  ticks.forEach(v=>{ s.appendChild(svg('line',{class:v===0?'zl':'gl',x1:mL,x2:W-mR,y1:Y(v),y2:Y(v)}));
    const tx=svg('text',{x:mL-8,y:Y(v)+3,'text-anchor':'end'}); tx.textContent=compact(v); s.appendChild(tx); });
  const zy=Y(0);
  pts.forEach((p,i)=>{
    const x=mL+gw*i+(gw-bw)/2;
    const y=p.v>=0? Y(p.v):zy, h=Math.max(1.5,Math.abs(zy-Y(p.v)));
    const r=svg('rect',{x,y,width:bw,height:h,rx:Math.min(3,bw/2),fill:color});
    const lbl = p.k.length===7? fmtMonth(p.k) : fmtDate(p.k);
    r.addEventListener('mousemove',ev=>showTip('<b>'+lbl+'</b><div class="r"><span>'+t('psp_net')+'</span><b>'+money(p.v)+'</b></div>',ev));
    r.addEventListener('mouseleave',hideTip);
    s.appendChild(r);
  });
  const step=Math.ceil(pts.length/(dense?6:12));
  pts.forEach((p,i)=>{ if(i%step) return;
    const tx=svg('text',{x:mL+gw*i+gw/2,y:H-9,'text-anchor':'middle'});
    tx.textContent = p.k.length===7? monName(+p.k.slice(5,7)-1)+" '"+p.k.slice(2,4) : p.k.slice(5);
    s.appendChild(tx); });
  host.innerHTML=''; host.appendChild(s);
}
</script>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أدوات العمليات المالية</title>
<meta name="description" content="لوحة أدوات المطابقة والتسوية — Financial Operations">
<meta name="theme-color" content="#17222E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%2317222E'/%3E%3Cg fill='%23fff'%3E%3Crect x='7.5' y='9' width='2.8' height='22' rx='1.4'/%3E%3Crect x='13' y='9' width='1.6' height='22' rx='.8'/%3E%3Crect x='17.3' y='9' width='3.4' height='22' rx='1.7'/%3E%3Crect x='23.4' y='9' width='1.6' height='22' rx='.8'/%3E%3Crect x='27.8' y='9' width='2.8' height='22' rx='1.4'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  --paper:#F2F5F8; --card:#FFFFFF; --sunk:#E9EEF3;
  --ink:#17222E; --ink2:#2E3D4E; --mute:#5B6B7C; --faint:#8798A9;
  --rule:#D5DDE6; --focus:#2563A8; --rail:300px;
}
@media(prefers-color-scheme:dark){:root{
  --paper:#0F161D; --card:#161F29; --sunk:#111922;
  --ink:#E7EEF5; --ink2:#C2CFDC; --mute:#8CA0B3; --faint:#6B7E92;
  --rule:#26323E; --focus:#6AA5E8;
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--paper); color:var(--ink); overflow:hidden;
  font-family:'IBM Plex Sans Arabic','IBM Plex Sans',system-ui,sans-serif;
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
  display:grid; grid-template-columns:var(--rail) 1fr; height:100vh;
}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ------------------------------------------------ rail */
.rail{background:var(--ink);color:#DCE6F0;display:flex;flex-direction:column;overflow:hidden}
.rhead{padding:18px 18px 15px;border-bottom:1px solid rgba(255,255,255,.09)}
.rbrand{display:flex;align-items:center;gap:10px}
.rbrand svg{width:28px;height:28px;flex:none}
.rbrand b{font-size:14.5px;font-weight:600;letter-spacing:-.01em;display:block}
.rbrand span{font-size:11.5px;color:#8FA2B5;display:block;margin-top:1px}

.scrim{position:fixed;inset:0;background:rgba(10,16,22,.45);z-index:50;display:none}
.rnav{flex:1;overflow:auto;padding:14px 10px 18px}
.grp{font-size:11px;color:#7E93A8;font-weight:600;padding:10px 9px 6px}
a.item{
  display:block;text-decoration:none;color:#C7D4E1;border-radius:7px;
  padding:9px 11px;margin-bottom:2px;transition:background .12s,color .12s;
  border-right:2px solid transparent;
}
a.item:hover{background:rgba(255,255,255,.06);color:#fff}
a.item.on{background:var(--card);color:var(--ink);border-right-color:var(--focus)}
a.item .n{display:block;font-size:13.5px;font-weight:600;font-family:'IBM Plex Sans',sans-serif;letter-spacing:-.01em}
a.item .a{display:block;font-size:12px;color:#8FA2B5;margin-top:1px}
a.item.on .a{color:var(--mute)}

.rfoot{padding:12px 16px 15px;border-top:1px solid rgba(255,255,255,.09);font-size:11.5px;color:#7E93A8}
.rfoot a{color:#9FB2C4}

/* ------------------------------------------------ stage */
.stage{display:flex;flex-direction:column;min-width:0;background:var(--paper)}
.bar{display:none;align-items:center;gap:12px;padding:9px 16px;
  border-bottom:1px solid var(--rule);background:var(--card);flex-wrap:wrap}
@media(max-width:900px){.bar{display:flex}}
/* on a wide screen the only thing worth floating over the tool is the way out of it */
.popout{
  position:absolute;left:14px;bottom:14px;z-index:5;text-decoration:none;
  background:var(--ink);color:#fff;border-radius:999px;padding:8px 13px;
  font-size:12px;font-weight:500;opacity:.82;transition:opacity .12s;
  box-shadow:0 3px 14px -5px rgba(0,0,0,.5);
}
.popout:hover{opacity:1}
@media(max-width:900px){.popout{display:none}}
.bar .burger{display:none;background:transparent;border:1px solid var(--rule);color:var(--ink);
  border-radius:6px;padding:5px 9px;font:inherit;font-size:13px;cursor:pointer}
.bar h1{margin:0;font-size:14.5px;font-weight:600;font-family:'IBM Plex Sans',sans-serif}
.bar .sub{font-size:12.5px;color:var(--mute);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .sp{margin-right:auto}
.bar a.out{
  text-decoration:none;color:var(--ink);border:1px solid var(--rule);border-radius:6px;
  padding:5px 11px;font-size:12.5px;font-weight:500;background:var(--card);white-space:nowrap}
.bar a.out:hover{border-color:var(--focus)}

.frameWrap{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--paper)}
.load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--mute);font-size:13px;background:var(--paper)}
.load.gone{display:none}

/* ------------------------------------------------ home */
.home{flex:1;overflow:auto;padding:28px 26px 50px}
.home h2{margin:0 0 5px;font-size:19px;font-weight:600;letter-spacing:-.01em}
.home .lede{margin:0 0 24px;font-size:13.5px;color:var(--mute);max-width:66ch}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(286px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:15px 16px 16px;
  text-decoration:none;color:inherit;display:block;transition:border-color .14s}
.card:hover{border-color:var(--focus)}
.card .t{display:flex;align-items:center;gap:9px}
.card .t b{font-size:14.5px;font-weight:600;font-family:'IBM Plex Sans',sans-serif;letter-spacing:-.01em}
.card .t span{font-size:12.5px;color:var(--ink2);font-weight:500}
.card p{margin:6px 0 0;font-size:12.5px;color:var(--mute);line-height:1.6}
.ghead{margin:26px 0 12px;font-size:12.5px;color:var(--faint);font-weight:600}
.ghead:first-of-type{margin-top:0}
.privacy{margin-top:28px;border:1px solid var(--rule);border-radius:8px;background:var(--card);padding:14px 16px}
.privacy b{font-size:13px}
.privacy p{margin:4px 0 0;font-size:12.5px;color:var(--mute);max-width:74ch}

/* ------------------------------------------------ small screens */
@media(max-width:900px){
  body{grid-template-columns:1fr}
  .rail{position:fixed;inset-inline-start:0;top:0;bottom:0;width:272px;z-index:60;
    transform:translateX(100%);transition:transform .18s}
  [dir=rtl] .rail{transform:translateX(100%)}
  body.railopen .rail{transform:none}
  .bar .burger{display:block}
  body.railopen .scrim{display:block}
}
</style>
</head>
<body>

<nav class="rail" id="rail">
  <div class="rhead">
    <div class="rbrand">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <rect width="40" height="40" rx="9" fill="#FFFFFF"/>
        <g fill="#17222E">
          <rect x="7.5" y="9" width="2.8" height="22" rx="1.4"/><rect x="13" y="9" width="1.6" height="22" rx=".8"/>
          <rect x="17.3" y="9" width="3.4" height="22" rx="1.7"/><rect x="23.4" y="9" width="1.6" height="22" rx=".8"/>
          <rect x="27.8" y="9" width="2.8" height="22" rx="1.4"/>
        </g>
      </svg>
      <span><b>العمليات المالية</b><span>Kashier · Financial Operations</span></span>
    </div>
  </div>
  <div class="rnav" id="rnav"></div>
  <div class="rfoot">الداتا بتفضل في متصفحك. <a href="https://github.com/TechnicalTeam774/technicalteam774.github.io" target="_blank" rel="noopener">الكود</a></div>
</nav>
<div class="scrim" id="scrim"></div>

<section class="stage">
  <div class="bar">
    <button class="burger" id="burger" type="button" aria-label="الأدوات">☰</button>
    <h1 id="barName">كل الأدوات</h1>
    <span class="sub" id="barSub">سبع أدوات، كل واحدة في مكانها</span>
    <span class="sp"></span>
    <a class="out" id="barOut" href="#" target="_blank" rel="noopener" hidden>فتح في تاب لوحده</a>
  </div>

  <div class="home" id="home"></div>

  <div class="frameWrap" id="frameWrap" hidden>
    <iframe id="frame" title="الأداة المفتوحة"></iframe>
    <div class="load" id="load">بيفتح …</div>
    <a class="popout" id="popout" href="#" target="_blank" rel="noopener">فتح في تاب لوحده</a>
  </div>
</section>

<script>
const TOOLS=[
 {g:'المطابقة والتسوية', items:[
  {id:'rrn-check', n:'RRN Check', a:'مطابقة الـ RRN',
   d:'بتاخد ملف الفلاجز وتقولك إيه اللي البنك لسه عليه فلوس فيه وإيه اللي اتسوّى. بتطابق على الـ RRN الأول، المرجع الوحيد اللي مابيتكررش.'},
  {id:'recondesk', n:'ReconDesk', a:'مطابقة كشوف البنك',
   d:'مقارنة التسويات بين كشف البنك وكشف التاجر على مستوى الحساب، وإظهار الفروقات.'},
  {id:'wallet-reconciliation', n:'Wallet Reconciliation', a:'مطابقة المحافظ',
   d:'مطابقة حركات محافظ أورنج وإتصالات مع اللي عندنا.'},
  {id:'midlink', n:'MIDLink', a:'ربط الميدات',
   d:'بتملا الـ Merchant ID واسم التاجر ورقم المعاملة في شيت شركة التقسيط أو كشف البنك، بمطابقة كل خلية على مفاتيح تصدير البورتال.'}]},
 {g:'التسويات والمدفوعات', items:[
  {id:'morning-settlement', n:'Morning Settlement', a:'تسوية الصبح',
   d:'تجهيز دفعات التحويل اليومية على حسابات الأهلي وبنك مصر، وفصل اللي محتاج موافقة.'},
  {id:'event-settlement', n:'Event Settlement', a:'تسوية الإيفنتات',
   d:'حساب مستحقات كل فيندور في الإيفنت على مستوى الـ TID، وتجهيز ملف الدفع.'},
  {id:'ipn-splitter', n:'IPN Splitter', a:'تقسيم الـ IPN',
   d:'تقسيم ملفات الـ IPN وتجهيزها بالشكل اللي السيستم بيقبله.'}]}
];
const ALL={}; TOOLS.forEach(g=>g.items.forEach(t=>ALL[t.id]=t));
const $=id=>document.getElementById(id);

$('rnav').innerHTML='<a class="item" href="#" data-id=""><span class="n">كل الأدوات</span><span class="a">الصفحة الرئيسية</span></a>'+
 TOOLS.map(g=>'<div class="grp">'+g.g+'</div>'+g.items.map(t=>
  '<a class="item" href="#'+t.id+'" data-id="'+t.id+'"><span class="n">'+t.n+'</span><span class="a">'+t.a+'</span></a>').join('')).join('');

$('home').innerHTML='<h2>أدوات العمليات المالية</h2>'+
 '<p class="lede">كل أداة بتشتغل جوه متصفحك. اختار واحدة من الجنب وهتفتح هنا في مكانها.</p>'+
 TOOLS.map(g=>'<div class="ghead">'+g.g+'</div><div class="cards">'+g.items.map(t=>
  '<a class="card" href="#'+t.id+'"><div class="t"><b>'+t.n+'</b><span>'+t.a+'</span></div><p>'+t.d+'</p></a>').join('')+'</div>').join('')+
 '<div class="privacy"><b>الداتا بتفضل عندك</b><p>مفيش سيرفر ورا الأدوات دي. كل ملف بيتقري جوه متصفحك وبيتخزن في نفس المتصفح، فلو فتحتها من جهاز تاني هتلاقيها فاضية. الكود مفتوح على GitHub، الداتا لأ.</p></div>';

let cur=null;
function go(id){
 const t=ALL[id];
 document.querySelectorAll('.item').forEach(a=>a.classList.toggle('on',a.dataset.id===(t?id:'')));
 document.body.classList.remove('railopen');
 if(!t){
  cur=null;
  $('home').hidden=false; $('frameWrap').hidden=true; $('frame').removeAttribute('src');
  $('barName').textContent='كل الأدوات'; $('barSub').textContent='سبع أدوات، كل واحدة في مكانها';
  $('barOut').hidden=true; document.title='أدوات العمليات المالية';
  return;}
 $('home').hidden=true; $('frameWrap').hidden=false;
 $('barName').textContent=t.n; $('barSub').textContent=t.a;
 $('barOut').href='../'+id+'/'; $('barOut').hidden=false; $('popout').href='../'+id+'/';
 document.title=t.n+' — أدوات العمليات المالية';
 if(cur!==id){ $('load').classList.remove('gone'); $('frame').src='../'+id+'/'; cur=id; }
}
$('frame').addEventListener('load',()=>{
 $('load').classList.add('gone');
 /* the tool keeps its own back-link for when it is opened on its own */
 try{ const d=$('frame').contentDocument, n=d&&d.getElementById('suiteNav');
      if(n) n.style.display='none'; }catch(e){}
});
addEventListener('hashchange',()=>go(location.hash.slice(1)));
$('burger').onclick=()=>document.body.classList.toggle('railopen');
$('scrim').onclick=()=>document.body.classList.remove('railopen');
go(location.hash.slice(1));
</script>
</body>
</html>
